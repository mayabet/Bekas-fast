<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunamaw - Play 4</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #ffffff; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 400px; height: 100%; border: 3px solid #002d4b; margin: 0 auto; display: flex; flex-direction: column; box-sizing: border-box; }
        .yellow-banner { background: #ffcc00; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #002d4b; flex-shrink: 0; }
        .game-title { font-weight: 900; font-size: 16px; color: #000; }
        .plus18 { color: #ff0000; font-weight: 900; font-size: 24px; }
        .info-section { padding: 6px 12px; color: #002d4b; font-weight: 900; font-size: 14px; flex-shrink: 0; border-bottom: 2px solid #002d4b; }
        .balance-bar { background: #002d4b; color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; font-weight: 900; font-size: 18px; flex-shrink: 0; }
        .instruction { color: #00b050; font-weight: 900; text-align: center; padding: 6px 0; font-size: 16px; text-transform: uppercase; flex-shrink: 0; }
        
        .number-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            border: 2px solid #002d4b; 
            margin: 0 5px; 
            flex-shrink: 0; 
            overflow-y: scroll; 
            height: 165px; 
            background: #f9f9f9;
            -webkit-overflow-scrolling: touch;
        }

        .num-cell { border: 1px solid #002d4b; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #002d4b; cursor: pointer; transition: all 0.1s; position: relative; }
        .user-selected { background: #002d4b !important; color: #fff !important; }
        .taken-cell { background: #ccc !important; color: #666 !important; cursor: not-allowed; }
        .anim-active { background-color: #ff0000 !important; color: white !important; box-shadow: 0 0 15px #ff0000; z-index: 10; border: 2px solid #fff !important; }
        .winner-cell { background-color: #ffcc00 !important; color: black !important; box-shadow: 0 0 25px #ffcc00; transform: scale(1.1); z-index: 15; border: 3px solid #002d4b !important; }
        .winner2-cell { background-color: #00b050 !important; color: white !important; transform: scale(1.05); z-index: 12; border: 2px solid #002d4b !important; }
        
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 5px; flex-shrink: 0; }
        .stats-table td { border: 2px solid #002d4b; padding: 6px; font-weight: 900; text-align: center; font-size: 14px; }
        .bg-green { background: #00b050; color: white; }
        .list-container { margin: 5px; border: 2px solid #002d4b; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .selected-header { background: #ffcc00; text-align: center; font-weight: 900; padding: 6px; border-bottom: 2px solid #002d4b; font-size: 14px; flex-shrink: 0; }
        .scroll-area { overflow-y: auto; flex-grow: 1; }
        .selected-list { width: 100%; border-collapse: collapse; }
        .selected-list td { border-bottom: 1px solid #002d4b; height: 32px; padding: 0 10px; font-weight: 900; font-size: 13px; }
        .id-col { width: 40px; border-right: 2px solid #002d4b; text-align: center; background: #eee; }
        .win-row { background: #fff9c4; }
        .footer-nav { padding: 5px; border-top: 2px solid #002d4b; flex-shrink: 0; }
        .nav-btn { display: block; padding: 12px; text-align: center; color: white; font-weight: bold; text-decoration: none; font-size: 14px; border-radius: 4px; background: #002d4b; }
        .lang-bar { background: #fff; padding: 8px; display: flex; justify-content: space-between; font-weight: 900; border-top: 2px solid #002d4b; font-size: 14px; flex-shrink: 0; }
        .lang-btn { cursor: pointer; color: #002d4b; }
        .lang-btn.active { color: #00b050; text-decoration: underline; }
        .promo-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 10px; }
        .count-span { color: #ff0000; font-weight: 900; font-size: 20px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="yellow-banner"><span class="game-title" id="gt">20 ብር 1ኛ 880 2ኛ 20</span><span class="plus18">18+</span></div>
    <div class="info-section"><div><span id="dt_txt">ቀን</span>: <span id="date-label"></span></div><div><span id="tm_txt">ሰዓት</span>: <span id="time-label"></span></div></div>
    <div class="balance-bar"><span id="bl">ቀሪ ሂሳብ</span><span><span id="cash">0.00</span> <small>ETB</small></span></div>
    <div class="instruction" id="ins">ከ 1 እስከ 50 ያለውን ቁጥር ይምረጡ</div>
    <div class="number-grid" id="grid-container"></div>
    <table class="stats-table">
        <tr><td class="bg-green" id="ms">መልዕክት</td><td colspan="3" id="msg-box" style="font-weight: 900; font-size: 14px; min-height: 25px;">እንኳን ደህና መጡ!</td></tr>
        <tr><td class="bg-green" id="rn">ዙር</td><td id="round-val">1</td><td class="bg-green" id="ls">ያለፈው</td><td id="last-val">0</td></tr>
    </table>
    <div class="list-container">
        <div class="selected-header" id="sh">የተመረጡ ቁጥሮች</div>
        <div class="scroll-area" id="scroll-ui">
            <table class="selected-list" id="sel-table"></table>
        </div>
    </div>
    <div class="footer-nav"><a href="home.html" class="nav-btn" id="bb">ተመለስ</a></div>
    <div class="lang-bar"><span id="ll">ቋንቋ</span><div><span class="lang-btn active" id="l-am" onclick="setLang('am')">አማርኛ</span> | <span class="lang-btn" id="l-en" onclick="setLang('en')">ENGLISH</span></div></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAApcQQ3XySdQ6YG4wnrTUPnm0wZB078QQ",
        authDomain: "bekas-fast-d2a3b.firebaseapp.com",
        databaseURL: "https://bekas-fast-d2a3b-default-rtdb.firebaseio.com",
        projectId: "bekas-fast-d2a3b",
        storageBucket: "bekas-fast-d2a3b.firebasestorage.app",
        messagingSenderId: "130702344830",
        appId: "1:130702344830:web:58577289ec2f3208a64e2f"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    const gameRef = database.ref('live_game/play4'); 
    const resultRef = database.ref('live_game/play4_result');

    const userPhone = localStorage.getItem('loggedUser'); 
    let userName = "", balance = 0, currentLang = 'am', round = 1, selections = {}, isPlaying = false, isResetting = false, lastResultMsg = "";
    let lastWinners = null;

    const trans = {
        'am': {gt:'20 ብር 1ኛ 880 2ኛ 20', bl:'ቀሪ ሂሳብ', ins:'ከ 1 እስከ 50 ያለውን ቁጥር ይምረጡ', ms:'መልዕክት', rn:'ዙር', ls:'ያለፈው', sh:'የተመረጡ ቁጥሮች', bb:'ተመለስ', ll:'ቋንቋ', luck:'እጣዉ እየወጣ ነዉ: ', pick:'ቁጥር {n} ተመርጧል', low:'በቂ ሂሳብ የሎትም', removed: 'ቁጥር {n} ተሰርዟል', wait: 'እባክዎ ይጠብቁ...', brand: 'ቡናማዉ የቁጥር ጨዋታ ማጫወቻ', promo: 'ጨዋታዉ ከ 50 ሰዎች ጋር ሲሆን 1ኛ እና 2ኛ እጣ ይወጣል', promoWin: '1ኛ 880ብር | 2ኛ 20ብር', dt_txt: 'ቀን', tm_txt: 'ሰዓት', welcome: 'እንኳን ደህና መጡ!', win_list: 'የባለፈው ዙር አሸናፊዎች'},
        'en': {gt:'20 ETB 1st 880 2nd 20', bl:'BALANCE', ins:'PICK 1 TO 50', ms:'MSG', rn:'ROUND', ls:'LAST', sh:'SELECTED', bb:'BACK', ll:'LANG', luck:'DRAWING: ', pick:'NUM {n} PICKED', low:'LOW BALANCE', removed: 'NUM {n} REMOVED', wait: 'WAIT...', brand: 'BUNAMAW PICKER', promo: '50 Players. 1st & 2nd Win', promoWin: '1st 880 | 2nd 20', dt_txt: 'Date', tm_txt: 'Time', welcome: 'Welcome!', win_list: 'LAST ROUND WINNERS'}
    };

    if (!userPhone) window.location.replace("index.html");
    else {
        database.ref('users/' + userPhone).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) { userName = data.username; balance = parseFloat(data.balance || 0); document.getElementById('cash').innerText = balance.toFixed(2); }
        });
    }

    const grid = document.getElementById('grid-container');
    for(let i=1; i<=50; i++) {
        let cell = document.createElement('div'); cell.className = 'num-cell'; cell.id = `c-${i}`; cell.innerText = i; cell.onclick = () => pick(i); grid.appendChild(cell);
    }

    gameRef.on('value', (snapshot) => {
        selections = snapshot.val() || {};
        if (Object.keys(selections).length === 0 && !isPlaying) { isResetting = false; resetGridColors(); }
        updateUI();
    });

    function pick(n) {
        const msg = document.getElementById('msg-box');
        if(isPlaying || isResetting) { msg.innerText = trans[currentLang].wait; return; }
        if (selections[n] && selections[n] !== userName) return;

        const now = Date.now();
        if (selections[n] === userName) {
            const lastPickTime = localStorage.getItem('lastPickTime_p4_' + n);
            if (lastPickTime && (now - lastPickTime < 20000)) {
                database.ref('users/' + userPhone).update({ balance: balance + 20 });
                gameRef.child(n).remove();
                localStorage.removeItem('lastPickTime_p4_' + n);
                msg.innerText = trans[currentLang].removed.replace('{n}', n);
                return;
            } else {
                msg.innerText = currentLang === 'am' ? "መሰረዝ አይቻልም (20 ሰከንድ አልፏል)" : "Expired (20s)";
                return;
            }
        }

        if (balance < 20) { msg.innerText = trans[currentLang].low; msg.style.color = "red"; return; }

        database.ref('users/' + userPhone).update({ balance: balance - 20 });
        localStorage.setItem('lastPickTime_p4_' + n, now);
        
        gameRef.child(n).set(userName).then(() => {
            gameRef.once('value', (snap) => {
                const currentData = snap.val() || {};
                if (Object.keys(currentData).length === 50 && !isPlaying && !isResetting) {
                    let win1 = Math.floor(Math.random() * 50) + 1;
                    let win2;
                    do { win2 = Math.floor(Math.random() * 50) + 1; } while (win2 === win1);
                    resultRef.set({ winningNum: win1, winningNum2: win2, status: "START_ANIMATION", timestamp: Date.now(), startTime: Date.now() });
                }
            });
        });
        msg.innerText = trans[currentLang].pick.replace('{n}', n);
        msg.style.color = "#002d4b";
    }

    function updateUI() {
        const scrollArea = document.getElementById('scroll-ui');
        const header = document.getElementById('sh');
        const msg = document.getElementById('msg-box');
        const count = Object.keys(selections).length;

        if (count === 0 && !isPlaying) {
            if (lastWinners) {
                header.innerText = trans[currentLang].win_list;
                scrollArea.innerHTML = '<table class="selected-list" id="sel-table"></table>';
                const table = document.getElementById('sel-table');
                let row1 = table.insertRow(); row1.className = "win-row";
                row1.innerHTML = `<td class="id-col" style="background:#ffcc00">${lastWinners.n1}</td><td>${lastWinners.u1} {1ኛ እጣ 80ብር}</td>`;
                let row2 = table.insertRow(); row2.className = "win-row";
                row2.innerHTML = `<td class="id-col" style="background:#00b050; color:white">${lastWinners.n2}</td><td>${lastWinners.u2} {2ኛ እጣ እራሱን ችሏል}</td>`;
            } else {
                header.innerText = trans[currentLang].sh;
                scrollArea.innerHTML = `<div class="promo-box"><div style="color:#8b4513; font-size:22px; font-weight:900;">${trans[currentLang].brand}</div><div style="color:#002d4b; font-size:16px; margin:5px 0; font-weight:bold;">${trans[currentLang].promo}</div><div style="color:#00b050; font-size:28px; font-weight:900;">${trans[currentLang].promoWin}</div></div>`;
            }
            if(lastResultMsg !== "") msg.innerText = lastResultMsg;
            resetGridColors();
            return;
        }

        header.innerText = trans[currentLang].sh;
        scrollArea.innerHTML = '<table class="selected-list" id="sel-table"></table>';
        const table = document.getElementById('sel-table');
        for(let i=1; i<=50; i++) {
            const cell = document.getElementById(`c-${i}`);
            let occupant = selections[i] || "";
            if (occupant === userName) cell.className = "num-cell user-selected";
            else if (occupant !== "") cell.className = "num-cell taken-cell";
            else if (!isPlaying) cell.className = "num-cell";
            if (occupant !== "") {
                let row = table.insertRow();
                row.innerHTML = `<td class="id-col">${i}</td><td>${occupant}</td>`;
            }
        }
    }

    resultRef.on('value', (snap) => {
        const data = snap.val();
        if (!data) return;
        const now = Date.now();
        const animDuration = 11000;
        const elapsed = now - (data.startTime || data.timestamp);

        if (data.status === "START_ANIMATION" || data.status === "RUNNING") {
            if (elapsed < animDuration && !isPlaying && !isResetting) {
                isPlaying = true;
                runAnimation(data.winningNum, data.winningNum2, animDuration - elapsed);
            } else if (elapsed >= animDuration && !isPlaying && !isResetting) {
                isPlaying = true;
                finishGame(data.winningNum, data.winningNum2);
            }
        }
    });

    function runAnimation(win1, win2, durationMs) {
        let timeLeft = Math.floor(durationMs / 1000);
        const msg = document.getElementById('msg-box');
        let countdownInterval = setInterval(() => {
            msg.innerHTML = `${trans[currentLang].luck} <span class="count-span">${timeLeft}</span>`;
            timeLeft--;
            if (timeLeft < 0) clearInterval(countdownInterval);
        }, 1000);

        let counter = 0, speed = 80;
        let animationInterval = setInterval(() => {
            document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('anim-active'));
            let tempIdx = Math.floor(Math.random() * 50) + 1;
            const target = document.getElementById(`c-${tempIdx}`);
            if (target) {
                target.classList.add('anim-active');
                target.scrollIntoView({ behavior: 'auto', block: 'nearest' });
            }
            counter += speed;
            if (counter >= durationMs) { 
                clearInterval(animationInterval); clearInterval(countdownInterval);
                finishGame(win1, win2); 
            }
        }, speed);
    }

    function finishGame(win1, win2) {
        const msg = document.getElementById('msg-box');
        document.getElementById('last-val').innerText = win1;
        document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('anim-active'));
        
        const cell1 = document.getElementById(`c-${win1}`);
        const cell2 = document.getElementById(`c-${win2}`);
        if(cell1) { cell1.classList.add('winner-cell'); cell1.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        if(cell2) cell2.classList.add('winner2-cell');

        lastWinners = { n1: win1, u1: selections[win1] || "---", n2: win2, u2: selections[win2] || "---" };

        let res1 = currentLang === 'am' ? `1ኛ: ቁጥር ${win1}` : `1st: Num ${win1}`;
        let res2 = currentLang === 'am' ? `2ኛ: ቁጥር ${win2}` : `2nd: Num ${win2}`;
        let statusMsg = "";
        
        const currentRoundId = win1 + "_" + win2 + "_" + Date.now().toString().slice(0,7);
        if (localStorage.getItem('lastChecked_p4') !== currentRoundId) {
            if(selections[win1] === userName) {
                database.ref('users/' + userPhone).update({ balance: balance + 880 });
                statusMsg = currentLang === 'am' ? " - 880 ብር አሸንፈዋል!" : " - You won 880!";
                msg.style.color = "green";
            } else if(selections[win2] === userName) {
                database.ref('users/' + userPhone).update({ balance: balance + 20 });
                statusMsg = currentLang === 'am' ? " - 20 ብር ተመላሽ!" : " - 20 Refunded!";
                msg.style.color = "blue";
            } else {
                statusMsg = currentLang === 'am' ? " - እድል ለሌላ ጊዜ" : " - Try Again";
                msg.style.color = "red";
            }
            localStorage.setItem('lastChecked_p4', currentRoundId);
        }
        
        lastResultMsg = res1 + " | " + res2 + statusMsg;
        msg.innerText = lastResultMsg;

        setTimeout(() => {
            if (selections[win1] === userName || Object.keys(selections)[0] === userName) {
                isResetting = true;
                database.ref().update({'live_game/play4': null, 'live_game/play4_result': null}).then(() => {
                    document.getElementById('round-val').innerText = ++round;
                    isPlaying = false; isResetting = false;
                    grid.scrollTo({ top: 0, behavior: 'smooth' });
                    resetGridColors(); updateUI();
                });
            } else {
                setTimeout(() => { if (!isPlaying) { document.getElementById('round-val').innerText = ++round; resetGridColors(); updateUI(); } }, 1000);
            }
        }, 5000); 
    }

    function resetGridColors() {
        document.querySelectorAll('.num-cell').forEach(cell => { cell.className = "num-cell"; });
    }

    function setLang(l) { 
        currentLang = l; 
        for(let k in trans[l]) { if(document.getElementById(k)) document.getElementById(k).innerText = trans[l][k]; }
        document.getElementById('l-am').classList.toggle('active', l === 'am');
        document.getElementById('l-en').classList.toggle('active', l === 'en');
        updateUI(); updateDateTime();
    }

    function updateDateTime() {
        const now = new Date();
        let h = now.getHours();
        let ethH = h >= 6 ? h - 6 : h + 6;
        if (ethH > 12) ethH -= 12;
        if (ethH === 0) ethH = 12;
        let ampm = h >= 18 || h < 6 ? (currentLang === 'am' ? 'ማታ' : 'Night') : (currentLang === 'am' ? 'ቀን' : 'Day');
        document.getElementById('time-label').innerText = `${ethH}:${now.getMinutes().toString().padStart(2, '0')} ${ampm}`;
        const startOfYekatit = new Date(2026, 1, 8); 
        const diffDays = Math.floor((now - startOfYekatit) / (1000 * 60 * 60 * 24)) + 1;
        document.getElementById('date-label').innerText = (currentLang === 'am') ? "የካቲት " + diffDays + ", 2018" : now.toDateString().toUpperCase();
    }

    setInterval(updateDateTime, 1000);
    window.onload = () => { setLang('am'); updateDateTime(); };
</script>
</body>
</html>
