<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunamaw - Play 4 (Final)</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #ffffff; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 400px; height: 100%; border: 3px solid #002d4b; margin: 0 auto; display: flex; flex-direction: column; box-sizing: border-box; }
        .yellow-banner { background: #ffcc00; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #002d4b; flex-shrink: 0; }
        .game-title { font-weight: 900; font-size: 16px; color: #000; }
        .plus18 { color: #ff0000; font-weight: 900; font-size: 24px; }
        .info-section { padding: 6px 12px; color: #002d4b; font-weight: 900; font-size: 14px; flex-shrink: 0; border-bottom: 2px solid #002d4b; }
        .balance-bar { background: #002d4b; color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; font-weight: 900; font-size: 18px; flex-shrink: 0; }
        .instruction { color: #00b050; font-weight: 900; text-align: center; padding: 6px 0; font-size: 16px; text-transform: uppercase; flex-shrink: 0; }
        
        /* Grid: Shows 1-20 (4 rows) then scroll */
        .number-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            border: 2px solid #002d4b; 
            margin: 0 5px; 
            flex-shrink: 0; 
            height: 160px; 
            overflow-y: auto; 
            background: #eee; 
            -webkit-overflow-scrolling: touch;
        }
        .num-cell { border: 1px solid #002d4b; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #002d4b; cursor: pointer; transition: all 0.1s; background: #fff; }
        
        .user-selected { background: #002d4b !important; color: #fff !important; }
        .taken-cell { background: #ccc !important; color: #666 !important; cursor: not-allowed; }
        .anim-active { background-color: #ff0000 !important; color: white !important; z-index: 10; border: 2px solid #fff !important; }
        .winner-cell { background-color: #ffcc00 !important; color: black !important; box-shadow: 0 0 25px #ffcc00; transform: scale(1.1); z-index: 15; border: 3px solid #002d4b !important; }
        .winner2-cell { background-color: #00b050 !important; color: white !important; transform: scale(1.05); z-index: 12; border: 2px solid #002d4b !important; }
        
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 5px; flex-shrink: 0; }
        .stats-table td { border: 2px solid #002d4b; padding: 6px; font-weight: 900; text-align: center; font-size: 14px; }
        .bg-green { background: #00b050; color: white; }
        
        .list-container { margin: 5px; border: 2px solid #002d4b; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .selected-header { background: #ffcc00; text-align: center; font-weight: 900; padding: 6px; border-bottom: 2px solid #002d4b; font-size: 14px; flex-shrink: 0; }
        .scroll-area { overflow-y: auto; flex-grow: 1; background: #fff; }
        .selected-list { width: 100%; border-collapse: collapse; }
        .selected-list td { border-bottom: 1px solid #002d4b; padding: 8px 10px; font-weight: 900; font-size: 13px; }
        .id-col { width: 95px; border-right: 2px solid #002d4b; text-align: center; background: #eee; }
        
        .promo-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 15px; }
        .footer-nav { padding: 5px; border-top: 2px solid #002d4b; flex-shrink: 0; }
        .nav-btn { display: block; padding: 12px; text-align: center; color: white; font-weight: bold; text-decoration: none; font-size: 14px; border-radius: 4px; background: #002d4b; }
        .lang-bar { background: #fff; padding: 8px; display: flex; justify-content: space-between; font-weight: 900; border-top: 2px solid #002d4b; font-size: 14px; flex-shrink: 0; }
        .lang-btn { cursor: pointer; color: #002d4b; }
        .lang-btn.active { color: #00b050; text-decoration: underline; }
        .count-span { color: #ff0000; font-weight: 900; font-size: 20px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="yellow-banner"><span class="game-title" id="gt">20 ብር 1ኛ 880 2ኛ 20</span><span class="plus18">18+</span></div>
    <div class="info-section"><div><span id="dt_txt">ቀን</span>: <span id="date-label"></span></div><div><span id="tm_txt">ሰዓት</span>: <span id="time-label"></span></div></div>
    <div class="balance-bar"><span id="bl">ቀሪ ሂሳብ</span><span><span id="cash">0.00</span> <small>ETB</small></span></div>
    <div class="instruction" id="ins">ከ 1 እስከ 50 ያለውን ቁጥር ይምረጡ</div>
    <div class="number-grid" id="grid-container"></div>
    <table class="stats-table">
        <tr><td class="bg-green" id="ms">መልዕክት</td><td colspan="3" id="msg-box" style="font-weight: 900; font-size: 14px; min-height: 25px;">እንኳን ደህና መጡ!</td></tr>
        <tr><td class="bg-green" id="rn">ዙር</td><td id="round-val">1</td><td class="bg-green" id="ls">ያለፈው</td><td id="last-val">0</td></tr>
    </table>
    <div class="list-container">
        <div class="selected-header" id="sh">የተመረጡ ቁጥሮች</div>
        <div class="scroll-area" id="scroll-ui"></div>
    </div>
    <div class="footer-nav"><a href="home.html" class="nav-btn" id="bb">ተመለስ</a></div>
    <div class="lang-bar"><span id="ll">ቋንቋ</span><div><span class="lang-btn active" id="l-am" onclick="setLang('am')">አማርኛ</span> | <span class="lang-btn" id="l-en" onclick="setLang('en')">ENGLISH</span></div></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAApcQQ3XySdQ6YG4wnrTUPnm0wZB078QQ",
        authDomain: "bekas-fast-d2a3b.firebaseapp.com",
        databaseURL: "https://bekas-fast-d2a3b-default-rtdb.firebaseio.com",
        projectId: "bekas-fast-d2a3b",
        storageBucket: "bekas-fast-d2a3b.firebasestorage.app",
        messagingSenderId: "130702344830",
        appId: "1:130702344830:web:58577289ec2f3208a64e2f"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const gameRef = database.ref('live_game/play4');
    const resultRef = database.ref('live_game/play4_result');

    const userPhone = localStorage.getItem('loggedUser');
    let userName = "", balance = 0, currentLang = 'am', round = 1, selections = {}, isPlaying = false, isResetting = false, serverOffset = 0, gameHistory = [];

    database.ref(".info/serverTimeOffset").on("value", (snap) => { serverOffset = snap.val() || 0; });

    const trans = {
        'am': {gt:'20 ብር 1ኛ 880 2ኛ 20', bl:'ቀሪ ሂሳብ', ins:'ከ 1 እስከ 50 ያለውን ቁጥር ይምረጡ', ms:'መልዕክት', rn:'ዙር', ls:'ያለፈው', sh:'የተመረጡ ቁጥሮች', bb:'ተመለስ', ll:'ቋንቋ', luck:'እጣዉ እየወጣ ነዉ: ', low:'በቂ ሂሳብ የሎትም', removed: 'ቁጥር {n} ተሰርዟል', wait: 'እባክዎ ይጠብቁ...', n1_lbl: '1ኛ ቁጥር', n2_lbl: '2ኛ ቁጥር', birr_lbl: 'ብር', win_list: 'ያለፉ ውጤቶች', self: 'እራሱን ችሏል', dt_txt: 'ቀን', tm_txt: 'ሰዓት'},
        'en': {gt:'20 ETB 1st 880 2nd 20', bl:'BALANCE', ins:'PICK 1 TO 50', ms:'MESSAGE', rn:'ROUND', ls:'LAST', sh:'SELECTED', bb:'BACK', ll:'LANG', luck:'DRAWING: ', low:'LOW BALANCE', removed: 'NUM {n} REMOVED', wait: 'WAIT...', n1_lbl: '1st Num', n2_lbl: '2nd Num', birr_lbl: 'ETB', win_list: 'LAST RESULTS', self: 'Return', dt_txt: 'Day', tm_txt: 'Time'}
    };

    if (!userPhone) window.location.replace("index.html");
    else {
        database.ref('users/' + userPhone).on('value', (snap) => {
            const data = snap.val(); if (data) { userName = data.username; balance = parseFloat(data.balance || 0); document.getElementById('cash').innerText = balance.toFixed(2); }
        });
    }

    const grid = document.getElementById('grid-container');
    for(let i=1; i<=50; i++) {
        let cell = document.createElement('div'); cell.className = 'num-cell'; cell.id = `c-${i}`; cell.innerText = i; cell.onclick = () => pick(i); grid.appendChild(cell);
    }

    gameRef.on('value', (snap) => {
        selections = snap.val() || {};
        if (Object.keys(selections).length === 0 && !isPlaying) { isResetting = false; resetGridColors(); }
        updateUI();
    });

    async function pick(n) {
        const msg = document.getElementById('msg-box');
        const nowServer = Date.now() + serverOffset;
        if(isPlaying || isResetting) return;
        if (selections[n] && selections[n] !== userName) return;
        
        if (selections[n] === userName) {
            const lastTime = localStorage.getItem('lastPick_p4_' + n);
            if (lastTime && (nowServer - lastTime < 20000)) {
                database.ref('users/' + userPhone).update({ balance: balance + 20 });
                gameRef.child(n).remove(); localStorage.removeItem('lastPick_p4_' + n);
                msg.innerText = trans[currentLang].removed.replace('{n}', n); return;
            } else { msg.innerText = "መሰረዝ አይቻልም"; return; }
        }
        
        if (balance < 20) { msg.innerText = trans[currentLang].low; return; }
        database.ref('users/' + userPhone).update({ balance: balance - 20 });
        localStorage.setItem('lastPick_p4_' + n, nowServer);
        gameRef.child(n).set(userName).then(() => {
            gameRef.once('value', (s) => {
                const currentSels = s.val() || {};
                if (Object.keys(currentSels).length === 20 && !isPlaying) {
                    let w1 = Math.floor(Math.random() * 50) + 1;
                    let w2; do { w2 = Math.floor(Math.random() * 50) + 1; } while (w2 === w1);
                    resultRef.set({ winningNum: w1, winningNum2: w2, startTime: firebase.database.ServerValue.TIMESTAMP });
                }
            });
        });
    }

    function updateUI() {
        const scrollArea = document.getElementById('scroll-ui');
        const header = document.getElementById('sh');
        
        if (Object.keys(selections).length === 0 && !isPlaying) {
            if (gameHistory.length > 0) {
                header.innerText = trans[currentLang].win_list;
                let html = '<table class="selected-list">';
                gameHistory.forEach(res => {
                    html += `<tr style="border-bottom:2px solid #002d4b"><td class="id-col">${res.time}</td>
                        <td style="padding:10px; font-size:13px; font-weight:900;">
                            <div style="color:#5D4037; border-bottom: 1px solid #ddd; padding-bottom:3px;">${trans[currentLang].n1_lbl} ${res.n1} 880 ${trans[currentLang].birr_lbl}: ${res.u1}</div>
                            <div style="color:#00b050;">${trans[currentLang].n2_lbl} ${res.n2} ${trans[currentLang].self}: ${res.u2}</div>
                        </td></tr>`;
                });
                scrollArea.innerHTML = html + '</table>';
            } else {
                scrollArea.innerHTML = `
                    <div class="promo-box">
                        <div style="color:#8b4513; font-size:22px; font-weight:900; margin-bottom:8px;">ቡናማዉ የቁጥር ጨዋታ</div>
                        <div style="font-weight:900; font-size:16px; color:#002d4b; margin-bottom:10px; line-height:1.4;">
                            ጨዋታዉ ከ 50 ሰዎች ጋር ሲሆን<br>1ኛ እና 2ኛ እጣ ይወጣል
                        </div>
                        <div style="color:#00b050; font-size:24px; font-weight:900; border:3px solid #00b050; padding:8px; border-radius:5px; background:#f9f9f9;">
                            1ኛ 880ብር | 2ኛ 20ብር
                        </div>
                    </div>`;
            }
            return;
        }

        header.innerText = trans[currentLang].sh;
        let tableHtml = '<table class="selected-list">';
        for(let i=1; i<=50; i++) {
            const cell = document.getElementById(`c-${i}`);
            let occupant = selections[i] || "";
            if (occupant === userName) cell.className = "num-cell user-selected";
            else if (occupant !== "") cell.className = "num-cell taken-cell";
            else if (!isPlaying) cell.className = "num-cell";
            if (occupant !== "") tableHtml += `<tr><td class="id-col">${i}</td><td>${occupant}</td></tr>`;
        }
        scrollArea.innerHTML = tableHtml + '</table>';
    }

    resultRef.on('value', (snap) => {
        const data = snap.val(); if (!data) return;
        const elapsed = (Date.now() + serverOffset) - data.startTime;
        if (elapsed < 10000 && !isPlaying) { isPlaying = true; runAnimation(data.winningNum, data.winningNum2, 10000 - elapsed); }
        else if (elapsed >= 10000 && elapsed < 25000 && !isPlaying) finishGame(data.winningNum, data.winningNum2);
    });

    function runAnimation(w1, w2, dur) {
        let timeLeft = Math.floor(dur / 1000);
        let cd = setInterval(() => { document.getElementById('msg-box').innerHTML = `${trans[currentLang].luck} <span class="count-span">${timeLeft}</span>`; timeLeft--; if (timeLeft < 0) clearInterval(cd); }, 1000);
        let anim = setInterval(() => {
            document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('anim-active'));
            let r = Math.floor(Math.random() * 50) + 1;
            const target = document.getElementById(`c-${r}`);
            if(target) { target.classList.add('anim-active'); target.scrollIntoView({ behavior: 'auto', block: 'nearest' }); }
        }, 80);
        setTimeout(() => { clearInterval(anim); clearInterval(cd); finishGame(w1, w2); }, dur);
    }

    function finishGame(w1, w2) {
        isPlaying = true; document.getElementById('last-val').innerText = w1;
        document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('anim-active'));
        const cell1 = document.getElementById(`c-${w1}`); 
        if(cell1) { cell1.classList.add('winner-cell'); cell1.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        if(document.getElementById(`c-${w2}`)) document.getElementById(`c-${w2}`).classList.add('winner2-cell');
        
        const now = new Date();
        const timeStr = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
        gameHistory.unshift({ n1: w1, u1: selections[w1] || "---", n2: w2, u2: selections[w2] || "---", time: timeStr });
        if(gameHistory.length > 5) gameHistory.pop();
        
        document.getElementById('msg-box').innerText = `1ኛ: ${w1} | 2ኛ: ${w2}`;
        setTimeout(() => {
            const keys = Object.keys(selections);
            if (selections[keys[keys.length-1]] === userName) {
                isResetting = true;
                database.ref().update({'live_game/play4': null, 'live_game/play4_result': null}).then(() => {
                    document.getElementById('round-val').innerText = ++round;
                    isPlaying = false; isResetting = false; grid.scrollTo({ top: 0 }); resetGridColors(); updateUI();
                });
            } else { setTimeout(() => { if(!isResetting) { document.getElementById('round-val').innerText = ++round; isPlaying = false; resetGridColors(); updateUI(); } }, 2000); }
        }, 5000);
    }

    function resetGridColors() { document.querySelectorAll('.num-cell').forEach(c => { c.className = "num-cell"; }); }
    
    function updateDateTime() {
        const now = new Date();
        document.getElementById('time-label').innerText = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('date-label').innerText = currentLang === 'am' ? "የካቲት 8 ቀን 2018" : "Feb 15, 2026";
    }

    function setLang(l) { currentLang = l; for(let k in trans[l]) { if(document.getElementById(k)) document.getElementById(k).innerText = trans[l][k]; } updateDateTime(); updateUI(); }

    setInterval(updateDateTime, 1000);
    window.onload = () => { setLang('am'); };
</script>
</body>
</html>
