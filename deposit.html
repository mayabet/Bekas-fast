<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunamaw ቡናማዉ - Deposit</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Noto+Sans+Ethiopic:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        html, body { margin: 0; padding: 0; min-height: 100%; overflow-y: auto; background: #eef2f7; font-family: 'Noto Sans Ethiopic', sans-serif; }
        body { display: flex; justify-content: center; padding: 10px 0; }
        .app-card { width: 94%; max-width: 360px; background: #fff; border-radius: 15px; border: 2px solid #002d4b; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .yellow-bar { background: #002d4b; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        .title-txt { font-weight: 900; font-size: 17px; }
        .plus18 { color: #ff8c00; font-size: 18px; font-weight: 900; }
        .header-line { height: 3px; background: #ff8c00; width: 100%; }
        .content { padding: 12px; }
        .user-card { background: #002d4b; border-radius: 12px; padding: 15px 10px; margin-bottom: 15px; text-align: center; color: #fff; }
        .bal-val { font-weight: 900; font-size: 30px; color: #ff8c00; }
        .instruction-box { background: #f9f9f9; border-radius: 15px; padding: 10px; margin-bottom: 15px; text-align: center; border: 1px dashed #002d4b; }
        .tele-num { color: #d00000; font-size: 19px; font-weight: 900; }
        .copy-btn { background: #ff8c00; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 900; cursor: pointer; }
        .textarea-wrapper { border: 2px solid #002d4b; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        .input-box-textarea { width: 100%; border: none; padding: 10px; font-size: 14px; min-height: 80px; box-sizing: border-box; outline: none; }
        #msg-display { font-size: 14px; font-weight: 900; text-align: center; margin-bottom: 8px; min-height: 20px; }
        .btn-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .btn { padding: 14px; border: none; border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-main { background: #002d4b; color: white; }
        .btn-back { background: #777; color: white; }
        .lang-bar { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #ddd; background: #fcfcfc; }
        .lang-btn { cursor: pointer; font-weight: 900; color: #002d4b; font-size: 14px; }
        .active { color: #ff8c00; }
        #lbl-sms-desc { font-weight: 900; font-size: 15px; color: #000; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="yellow-bar">
        <span class="title-txt" id="title-name">ብር ማስገቢያ</span>
        <span class="plus18">18+</span>
    </div>
    <div class="header-line"></div>

    <div class="content">
        <div class="user-card">
            <span id="txt-bal-label" style="font-weight:900">ያለዎት ቀሪ ሂሳብ</span>
            <div class="bal-val"><span id="user-balance">0.00</span> <small style="font-size:16px" id="txt-curr">ብር</small></div>
        </div>

        <div class="instruction-box">
            <span id="txt-instr-main" style="font-weight:900; color:#002d4b;">በቴሌብር ወደዚህ ቁጥር ይላኩ፡</span><br><br>
            <b style="font-size:18px">Biniyam</b><br>
            <span class="tele-num" id="tele-val">+251978272061</span>
            <button class="copy-btn" onclick="copyPhone()" id="btn-copy-label">ገልብጥ</button>
        </div>

        <div id="msg-display"></div>

        <div class="input-group">
            <label id="lbl-sms-desc">የቴሌ ብር SMS እዚህ ጋር ይለጥፉ፡</label>
            <div class="textarea-wrapper">
                <textarea id="sms-input" class="input-box-textarea" placeholder="Dear customer, you have transferred..."></textarea>
            </div>
        </div>

        <div class="btn-stack">
            <button onclick="handleDeposit()" class="btn btn-main" id="btn-submit">ብር አስገባ</button>
            <a href="home.html" class="btn btn-back" id="btn-home">ተመለስ</a>
        </div>
    </div>

    <div class="lang-bar">
        <span class="lang-label">Language</span>
        <div class="lang-options">
            <span id="lang-am" class="lang-btn active" onclick="setLang('am')">አማርኛ</span>
            <span id="lang-en" class="lang-btn" onclick="setLang('en')">ENGLISH</span>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAApcQQ3XySdQ6YG4wnrTUPnm0wZB078QQ",
        authDomain: "bekas-fast-d2a3b.firebaseapp.com",
        databaseURL: "https://bekas-fast-d2a3b-default-rtdb.firebaseio.com",
        projectId: "bekas-fast-d2a3b",
        storageBucket: "bekas-fast-d2a3b.firebasestorage.app",
        messagingSenderId: "130702344830",
        appId: "1:130702344830:web:58577289ec2f3208a64e2f"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ማስተካከያ፡ ከ Login ገፅ ጋር እንዲመሳሰል ተደርጓል
    const userPhone = localStorage.getItem('loggedUser'); 
    let currentLang = 'am';

    if (userPhone) {
        database.ref('users/' + userPhone + '/balance').on('value', s => {
            document.getElementById('user-balance').innerText = (s.val() || 0).toFixed(2);
        });
    } else {
        // ተጠቃሚው ካልገባ ወደ login ይመለስ
        window.location.replace("index.html");
    }

    function showMsg(t, c) {
        const d = document.getElementById('msg-display');
        d.innerText = t; d.style.color = c;
        setTimeout(() => d.innerText = "", 6000);
    }

    function copyPhone() {
        const el = document.createElement('textarea');
        el.value = "0978272061";
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        showMsg(currentLang === 'am' ? "ቁጥሩ ተገልብጧል!" : "Copied!", "green");
    }

    function handleDeposit() {
        const sms = document.getElementById('sms-input').value.trim();
        if(!sms) return showMsg(currentLang === 'am' ? "እባክዎ SMS ይለጥፉ!" : "Please paste the SMS!", "red");

        const txMatch = sms.match(/[A-Z0-9]{10}/);
        const amtMatch = sms.match(/(?:ETB|ብር)\s*([\d,]+\.?\d*)/i);

        if(!txMatch) {
            return showMsg(currentLang === 'am' ? "የተሳሳተ SMS! ትራንዛክሽን ኮድ አልተገኘም" : "Invalid SMS! Transaction ID not found", "red");
        }

        const txID = txMatch[0];
        let amount = amtMatch ? parseFloat(amtMatch[1].replace(/,/g, '')) : 0;

        if(amount < 10) {
            return showMsg(currentLang === 'am' ? "ዝቅተኛው ማስገቢያ 10 ብር ነው" : "Min deposit is 10 ETB", "red");
        }

        database.ref('used_transactions/' + txID).once('value', snap => {
            if(snap.exists()){
                showMsg(currentLang === 'am' ? "ይህ SMS ቀደም ብሎ ጥቅም ላይ ውሏል!" : "Transaction already used!", "red");
            } else {
                processAutoDeposit(txID, amount, sms);
            }
        });
    }

    function processAutoDeposit(id, amt, fullSms) {
        showMsg(currentLang === 'am' ? "በማረጋገጥ ላይ..." : "Processing...", "blue");
        
        database.ref('deposit_requests').push({
            phone: userPhone,
            amount: amt,
            transactionCode: id,
            status: "pending",
            time: new Date().toLocaleString()
        }).then(() => {
            document.getElementById('sms-input').value = "";
            showMsg(currentLang === 'am' ? "ጥያቄው ተልኳል! በቅርቡ ይጨመርልዎታል" : "Sent! Will be added soon.", "green");
        });
    }

    function setLang(l) {
        currentLang = l;
        const isEn = l === 'en';
        document.getElementById('title-name').innerText = isEn ? "DEPOSIT" : "ብር ማስገቢያ";
        document.getElementById('txt-bal-label').innerText = isEn ? "YOUR BALANCE" : "ያለዎት ቀሪ ሂሳብ";
        document.getElementById('txt-instr-main').innerText = isEn ? "Send via Telebirr to:" : "በቴሌብር ወደዚህ ቁጥር ይላኩ፡";
        document.getElementById('lbl-sms-desc').innerText = isEn ? "Paste the Telebirr SMS here:" : "የቴሌ ብር SMS እዚህ ጋር ይለጥፉ፡";
        document.getElementById('btn-submit').innerText = isEn ? "DEPOSIT" : "ብር አስገባ";
        document.getElementById('btn-home').innerText = isEn ? "BACK" : "ተመለስ";
        document.getElementById('btn-copy-label').innerText = isEn ? "COPY" : "ገልብጥ";
        document.getElementById('lang-am').className = isEn ? 'lang-btn' : 'lang-btn active';
        document.getElementById('lang-en').className = isEn ? 'lang-btn active' : 'lang-btn';
    }
</script>
</body>
</html>
