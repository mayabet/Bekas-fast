<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ቡናማው ፈጣን እጣ - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        body { background: #1a1a1a; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; margin: 0; }
        .app-card { width: 100%; max-width: 400px; background: #fff; min-height: 100vh; display: flex; flex-direction: column; border: 2px solid #002d4b; }
        .top-banner { background: #002d4b; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #ff8c00; }
        .branding-wrapper { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 900; font-size: 19px; }
        .brand-icon { color: #ff8c00 !important; font-size: 24px !important; } 
        .plus18 { color: #ff8c00; font-weight: 900; font-size: 24px; }
        .content { padding: 15px; flex-grow: 1; }
        .live-info { background: #f0f4f8; color: #002d4b; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; display: flex; justify-content: space-between; font-weight: bold; border: 1px solid #ddd; }
        .user-section { background: linear-gradient(135deg, #002d4b 0%, #004a7c 100%); display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 15px; border-radius: 12px; color: white; }
        .bal { font-weight: 900; font-size: 22px; color: #ff8c00; }
        .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .q-btn { padding: 12px; border: none; color: white; font-weight: bold; border-radius: 8px; text-align: center; text-decoration: none; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .q-dep { background: #28a745; } 
        .q-with { background: #dc3545; } 
        .sport-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .sport-table th { background: #002d4b; color: #fff; font-size: 14px; padding: 12px 5px; font-weight: 900; border-bottom: 3px solid #ff8c00; }
        .sport-table td { background: #fff; border-bottom: 3px solid #002d4b; padding: 15px 5px; text-align: center; }
        .amt-v { font-size: 22px; font-weight: 900; color: #002d4b; display: block; }
        .sub-v { font-size: 14px; color: #000; font-weight: 900; display: block; margin-top: 2px; }
        .play-now { background: #002d4b; color: white; padding: 10px 14px; border-radius: 6px; text-decoration: none; font-weight: 900; font-size: 13px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .footer-nav { margin-top: auto; display: grid; gap: 10px; padding-bottom: 10px; }
        .f-link { padding: 14px; text-align: center; color: white; font-weight: 900; text-decoration: none; border-radius: 8px; font-size: 15px; }
        .l-info { background: #002d4b; }
        .l-out { background: #c00000; border: none; width: 100%; cursor: pointer; }
        .lang-bar { background: #f9f9f9; padding: 15px; display: flex; justify-content: space-between; font-size: 16px; font-weight: 900; border-top: 2px solid #eee; }
        .lang-btn { cursor: pointer; color: #002d4b; transition: color 0.3s ease; }
        .lang-btn.active { color: #ff8c00 !important; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="top-banner">
        <div class="branding-wrapper">
            <i class="fas fa-coffee brand-icon"></i>
            <span id="brand-name">ቡናማው ፈጣን እጣ</span>
        </div>
        <span class="plus18">18+</span>
    </div>
    
    <div class="content">
        <div class="live-info">
            <span id="date-label"></span>
            <span id="time-label"></span>
        </div>

        <div class="user-section">
            <div class="greet" style="font-weight: 900;"><span id="hello-text">ሰላም</span>, <span id="user-nick">...</span></div>
            <div class="bal"><span id="user-balance">0.00</span> <small id="bal-currency" style="color:white; font-weight: 900;">ብር</small></div>
        </div>

        <div class="quick-actions">
            <a href="deposit.html" class="q-btn q-dep" id="dep-btn">
                <i class="fas fa-wallet"></i> <span id="dep-text">ገንዘብ አስገባ</span>
            </a>
            <a href="withdraw.html" class="q-btn q-with" id="with-text">
                <i class="fas fa-money-bill-transfer"></i> <span id="with-text">ገንዘብ አውጣ</span>
            </a>
        </div>

        <table class="sport-table">
            <thead>
                <tr>
                    <th id="th-class">ክፍል</th>
                    <th id="th-qty">ብዛት</th>
                    <th id="th-reach">ደራሽ</th>
                    <th id="th-play-head">ተጫወት</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="amt-v">10</span><span class="sub-v birr-text">ብር</span></td>
                    <td><span class="amt-v">10</span><span class="sub-v p-text">ሰው</span></td>
                    <td><span class="amt-v">90</span><span class="sub-v birr-text">ብር</span></td>
                    <td><a href="play1.html" class="play-now p-btn">ተጫወት</a></td>
                </tr>
                <tr>
                    <td><span class="amt-v">10</span><span class="sub-v birr-text">ብር</span></td>
                    <td><span class="amt-v">20</span><span class="sub-v p-text">ሰው</span></td>
                    <td><span class="amt-v">180</span><span class="sub-v birr-text">ብር</span></td>
                    <td><a href="play2.html" class="play-now p-btn">ተጫወት</a></td>
                </tr>
                <tr>
                    <td><span class="amt-v">20</span><span class="sub-v birr-text">ብር</span></td>
                    <td><span class="amt-v">20</span><span class="sub-v p-text">ሰው</span></td>
                    <td><span class="amt-v">350</span><span class="sub-v birr-text">ብር</span></td>
                    <td><a href="play3.html" class="play-now p-btn">ተጫወት</a></td>
                </tr>
                <tr>
                    <td><span class="amt-v">20</span><span class="sub-v birr-text">ብር</span></td>
                    <td><span class="amt-v">50</span><span class="sub-v p-text">ሰው</span></td>
                    <td><span class="amt-v">900</span><span class="sub-v birr-text">ብር</span></td>
                    <td><a href="play4.html" class="play-now p-btn">ተጫወት</a></td>
                </tr>
            </tbody>
        </table>

        <div class="footer-nav">
            <a href="info.html" class="f-link l-info" id="info-btn">መረጃ እና መመሪያ</a>
            <button onclick="handleLogout()" class="f-link l-out" id="out-btn">ውጣ</button>
        </div>
    </div>

    <div class="lang-bar">
        <span id="lang-label">ቋንቋ</span>
        <div>
            <span id="lang-am" class="lang-btn active" onclick="setLang('am')">አማርኛ</span> | 
            <span id="lang-en" class="lang-btn" onclick="setLang('en')">ENGLISH</span>
        </div>
    </div>
</div>

<script>
    // Firebase Config ከ A.html
    const firebaseConfig = {
        apiKey: "AIzaSyAApcQQ3XySdQ6YG4wnrTUPnm0wZB078QQ",
        authDomain: "bekas-fast-d2a3b.firebaseapp.com",
        databaseURL: "https://bekas-fast-d2a3b-default-rtdb.firebaseio.com",
        projectId: "bekas-fast-d2a3b",
        storageBucket: "bekas-fast-d2a3b.firebasestorage.app",
        messagingSenderId: "130702344830",
        appId: "1:130702344830:web:58577289ec2f3208a64e2f"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    let currentLang = 'am';

    function setLang(l) {
        currentLang = l;
        const s = {
            'am': { 'brand': 'ቡናማው ፈጣን እጣ', 'hello': 'ሰላም', 'dep': 'ገንዘብ አስገባ', 'with': 'ገንዘብ አውጣ', 'class': 'ክፍል', 'qty': 'ብዛት', 'reach': 'ደራሽ', 'playhead': 'ተጫወት', 'info': 'መረጃ እና መመሪያ', 'out': 'ውጣ', 'lang': 'ቋንቋ', 'play': 'ተጫወት', 'people': 'ሰው', 'birr': 'ብር' },
            'en': { 'brand': 'BUNAMAW FAST', 'hello': 'Hi', 'dep': 'DEPOSIT', 'with': 'WITHDRAW', 'class': 'CLASS', 'qty': 'QTY', 'reach': 'REACH', 'playhead': 'PLAY', 'info': 'INFO & RULES', 'out': 'SIGN OUT', 'lang': 'LANGUAGE', 'play': 'PLAY', 'people': 'USERS', 'birr': 'BIRR' }
        }[l];
        
        document.getElementById('brand-name').innerText = s.brand;
        document.getElementById('hello-text').innerText = s.hello;
        document.getElementById('dep-text').innerText = s.dep;
        document.getElementById('with-text').innerText = s.with;
        document.getElementById('th-class').innerText = s.class;
        document.getElementById('th-qty').innerText = s.qty;
        document.getElementById('th-reach').innerText = s.reach;
        document.getElementById('th-play-head').innerText = s.playhead;
        document.getElementById('info-btn').innerText = s.info;
        document.getElementById('out-btn').innerText = s.out;
        document.getElementById('lang-label').innerText = s.lang;
        document.getElementById('bal-currency').innerText = s.birr;
        
        document.querySelectorAll('.p-btn').forEach(b => b.innerText = s.play);
        document.querySelectorAll('.p-text').forEach(t => t.innerText = s.people);
        document.querySelectorAll('.birr-text').forEach(t => t.innerText = s.birr);

        document.getElementById('lang-am').classList.toggle('active', l === 'am');
        document.getElementById('lang-en').classList.toggle('active', l === 'en');
        updateDateTime();
    }

    const amMonths = ["መስከረም", "ጥቅምት", "ህዳር", "ታህሳስ", "ጥር", "የካቲት", "መጋቢት", "ሚያዝያ", "ግንቦት", "ሰኔ", "ሐምሌ", "ነሐሴ", "ጳጉሜ"];
    function updateDateTime() {
        const now = new Date();
        if (currentLang === 'am') {
            document.getElementById('date-label').innerText = `${amMonths[(now.getMonth() + 3) % 12]} ${now.getDate()} ቀን ${now.getFullYear() - 8}`;
        } else {
            document.getElementById('date-label').innerText = now.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }
        document.getElementById('time-label').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateDateTime, 1000);

    const loggedUserPhone = localStorage.getItem('loggedUser');
    if (loggedUserPhone) {
        const userRef = firebase.database().ref('users/' + loggedUserPhone);
        userRef.on('value', (snapshot) => {
            const userData = snapshot.val();
            if (userData) {
                document.getElementById('user-nick').innerText = userData.nickname || "ተጫዋች";
                document.getElementById('user-balance').innerText = Number(userData.balance || 0).toFixed(2);
            } else {
                window.location.href = 'index.html';
            }
        });
    } else {
        window.location.href = 'index.html';
    }

    function handleLogout() {
        if(confirm(currentLang === 'am' ? "ለመውጣት እርግጠኛ ነዎት?" : "Are you sure?")) {
            localStorage.removeItem('loggedUser');
            window.location.href = 'index.html';
        }
    }

    window.onload = function() {
        setLang('am');
        updateDateTime();
    };
</script>
</body>
</html>
