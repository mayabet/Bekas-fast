<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MITA BETTING - ADMIN PANEL</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        html, body { width: 100%; margin: 0; padding: 0; background: #f0f0f0; font-family: sans-serif; overflow-x: hidden; }
        .header { background: #ffcc00; padding: 10px; text-align: center; font-weight: 900; font-size: 18px; border-bottom: 2px solid #000; position: sticky; top: 0; z-index: 1000; }
        .section { background: white; margin-bottom: 10px; border-bottom: 2px solid #002d4b; width: 100%; }
        .section-title { background: #002d4b; color: white; padding: 8px; font-size: 13px; font-weight: 900; text-transform: uppercase; text-align: center; }
        .card { padding: 8px 12px; border-bottom: 1px solid #ddd; width: 100%; box-sizing: border-box; }
        .row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .phone-text { font-weight: 900; font-size: 17px; color: #002d4b; }
        .amt-bold { color: #28a745; font-weight: 900; font-size: 18px; background: #e8f5e9; padding: 2px 8px; border-radius: 4px; border: 1px solid #28a745; }
        .trans-no-box { font-size: 13px; color: #333; background: #f1f1f1; font-weight: 700; padding: 3px 6px; border-radius: 4px; border: 1px solid #ccc; font-family: monospace; }
        .btn-green { background: #28a745; color: white; border: 1px solid #000; padding: 6px 12px; font-weight: 900; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .btn-red { background: #dc3545; color: white; border: 1px solid #000; padding: 6px 12px; font-weight: 900; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .pass-text { font-size: 14px; color: #ffffff; font-weight: 900; background: #dc3545; padding: 2px 6px; border-radius: 4px; }
        input[type="number"] { padding: 5px; border: 2px solid #002d4b; width: 85px; font-weight: 900; font-size: 14px; border-radius: 4px; text-align: center; }
        .history-item { padding: 8px 12px; border-bottom: 2px solid #ccc; background: #fff; border-left: 4px solid #002d4b; margin-bottom: 2px; font-size: 13px; }
        .stat-table { width: 100%; border-collapse: collapse; text-align: center; font-weight: 900; margin-top: 5px; }
        .stat-table td, .stat-table th { border: 1px solid #ddd; padding: 10px; }
    </style>
</head>
<body>

<div class="header">MITA BETTING - ADMIN PANEL</div>

<div class="section">
    <div class="section-title" style="background: #d00000; display: flex; justify-content: space-between; padding: 8px 15px;">
        <span>Lost Password Requests</span>
        <button onclick="if(confirm('Clear all?')) database.ref('password_requests').remove();" style="font-size:10px;">CLEAR ALL</button>
    </div>
    <div id="lost-pw-list"></div>
</div>

<div class="section">
    <div class="section-title">Deposit Requests (Auto Monitoring)</div>
    <div id="dep-list"></div>
</div>

<div class="section">
    <div class="section-title">Withdrawal Requests (ብር ማውጫ)</div>
    <div id="with-list"></div>
</div>

<div class="section">
    <div class="section-title">User Management</div>
    <div id="user-list"></div>
</div>

<div class="section">
    <div class="section-title">24H Game Stats</div>
    <table class="stat-table">
        <tr style="background: #eee; font-size: 12px;">
            <th>Game 1</th><th>Game 2</th><th>Game 3</th><th>Game 4</th>
        </tr>
        <tr>
            <td id="stat-play1">0</td><td id="stat-play2">0</td><td id="stat-play3">0</td><td id="stat-play4">0</td>
        </tr>
    </table>
</div>

<div class="section">
    <div class="section-title" style="display:flex; justify-content: space-around; align-items: center;">
        Transaction History 
        <button onclick="if(confirm('Clear history?')) database.ref('transaction_history').remove();" style="font-size:10px;">CLEAR</button>
    </div>
    <div id="history-list" style="max-height: 400px; overflow-y: auto;"></div>
</div>

<div class="section" style="text-align: center; padding: 15px; background: #fff0f0;">
    <button onclick="clearAllDataExceptUsers()" style="background: #000; color: #fff; padding: 12px 20px; font-weight: 900; border-radius: 5px; cursor: pointer; border: 2px solid red; width: 95%;">
        DELETE ALL DATA (STATS & HISTORY)
    </button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAApcQQ3XySdQ6YG4wnrTUPnm0wZB078QQ",
        authDomain: "bekas-fast-d2a3b.firebaseapp.com",
        databaseURL: "https://bekas-fast-d2a3b-default-rtdb.firebaseio.com",
        projectId: "bekas-fast-d2a3b",
        storageBucket: "bekas-fast-d2a3b.firebasestorage.app",
        messagingSenderId: "130702344830",
        appId: "1:130702344830:web:58577289ec2f3208a64e2f"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // --- ተሻሽሎ የቀረበ የ DEPOSIT AUTO-LOGIC (Reliable Version) ---
    database.ref('deposit_requests').on('child_added', (snapshot) => {
        const req = snapshot.val();
        const reqKey = snapshot.key;

        if (req && req.status === "pending") {
            const userTxCode = (req.transactionCode || "").trim().toUpperCase();
            const userAmt = parseFloat(req.amount);

            // 1. መጀመሪያ ይህ ኮድ ቀድሞ ጥቅም ላይ መዋሉን ቼክ ማድረግ
            database.ref('used_transactions/' + userTxCode).once('value', (usedSnap) => {
                if (usedSnap.exists()) {
                    database.ref('deposit_requests/' + reqKey).remove();
                    return;
                }

                // 2. በቅርብ የመጡ SMSዎችን ቼክ ማድረግ
                database.ref('telebirr_sms').once('value', (smsSnap) => {
                    smsSnap.forEach(child => {
                        const smsData = child.val();
                        const rawSMS = (smsData.content || "").trim();
                        const upperSMS = rawSMS.toUpperCase();

                        // ሎጂክ ማጣሪያዎች
                        const hasHeader = upperSMS.includes("DEAR") || upperSMS.includes("ውድ") || upperSMS.includes("ወድ");
                        
                        // የ 10 ዲጂት ኮድ ፍለጋ (DBA5ND8HC7 አይነት)
                        const txRegex = /[A-Z0-9]{10}/;
                        const match = upperSMS.match(txRegex);
                        const actualSMSCode = match ? match[0] : "";

                        // የብር መጠን ፍለጋ (ETB 600.00 ወይም ብር 600)
                        const amtRegex = /(?:ETB|ብር)\s*([\d,]+\.?\d*)/i;
                        const amtMatch = upperSMS.match(amtRegex);
                        let actualSMSAmt = 0;
                        if(amtMatch) {
                            actualSMSAmt = parseFloat(amtMatch[1].replace(/,/g, ''));
                        }

                        // ማነጻጸሪያ
                        const isTxMatch = (userTxCode === actualSMSCode);
                        const isAmtMatch = (Math.abs(userAmt - actualSMSAmt) < 1); // 1 ብር ልዩነት ቢኖርም እንዲያልፍ
                        const isSuccess = upperSMS.includes("TRANSFERRED") || upperSMS.includes("ተላልፏል") || upperSMS.includes("ተቀብለዋል");

                        if (hasHeader && isTxMatch && isAmtMatch && isSuccess) {
                            approveAutomaticDeposit(reqKey, req.phone, userAmt, userTxCode);
                            database.ref('telebirr_sms/' + child.key).remove();
                        }
                    });
                });
            });
        }
    });

    function approveAutomaticDeposit(key, phone, amt, txCode) {
        if (!amt || amt <= 0) return;
        database.ref('used_transactions/' + txCode).set({ 
            usedBy: phone, 
            amount: amt, 
            time: new Date().toISOString() 
        }).then(() => {
            database.ref('users/' + phone + '/balance').transaction(current => (current || 0) + amt, (error, committed) => {
                if (committed) {
                    database.ref('deposit_requests/' + key).remove();
                    logTransaction(phone, 'Auto Approved', amt);
                }
            });
        });
    }

    // --- የተቀሩት ተግባራት ---
    database.ref('deposit_requests').on('value', snap => {
        const cont = document.getElementById('dep-list'); cont.innerHTML = "";
        snap.forEach(child => {
            const r = child.val();
            cont.innerHTML += `<div class="card">
                <div class="row"><span class="phone-text">${r.phone}</span><span class="amt-bold">${r.amount} ETB</span></div>
                <div class="row" style="margin-top:5px;"><span class="trans-no-box">${r.transactionCode}</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-green" onclick="approveManual('${child.key}', '${r.phone}', ${r.amount}, '${r.transactionCode}')">OK</button>
                    <button class="btn-red" onclick="database.ref('deposit_requests/${child.key}').remove()">X</button>
                </div></div></div>`;
        });
    });

    function approveManual(key, phone, amt, txCode) {
        if(confirm("በእጅ ላጽድቀው?")) {
            approveAutomaticDeposit(key, phone, amt, txCode);
        }
    }

    database.ref('withdraw_requests').on('value', snap => {
        const cont = document.getElementById('with-list'); cont.innerHTML = "";
        snap.forEach(child => {
            const r = child.val();
            cont.innerHTML += `<div class="card" style="border-left: 5px solid #ff8c00;">
                <div class="row">
                    <div><span class="phone-text">👤 ${r.username || 'NO NAME'}</span><br><span class="phone-text">📞 ${r.phone}</span></div>
                    <span class="amt-bold" style="color:red; background:#fff0f0;">-${r.amount} ETB</span>
                </div>
                <div class="row" style="margin-top:8px;">
                    <button class="btn-green" onclick="database.ref('withdraw_requests/${child.key}').remove()">PAID</button>
                    <button class="btn-red" onclick="database.ref('withdraw_requests/${child.key}').remove()">CANCEL</button>
                </div></div>`;
        });
    });

    database.ref('users').on('value', snap => {
        const cont = document.getElementById('user-list'); cont.innerHTML = "";
        snap.forEach(child => {
            const u = child.val(); const phone = child.key;
            cont.innerHTML += `<div class="card">
                <div class="row"><span><span class="phone-text">${phone}</span></span><span class="pass-text">${u.password}</span></div>
                <div class="row" style="margin-top:8px;">
                    <span style="font-weight:900;">BAL: ${(u.balance || 0).toFixed(2)}</span>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="amt-${phone}" placeholder="Amt">
                        <button class="btn-green" onclick="adjustBal('${phone}', 'add')">+</button>
                        <button class="btn-red" onclick="adjustBal('${phone}', 'sub')">-</button>
                        <button class="btn-red" style="background:#000;" onclick="database.ref('users/${phone}').remove()">DEL</button>
                    </div></div></div>`;
        });
    });

    function adjustBal(phone, type) {
        const el = document.getElementById('amt-' + phone);
        const v = parseFloat(el.value);
        if (!v) return;
        database.ref('users/' + phone + '/balance').transaction(c => (c || 0) + (type === 'add' ? v : -v)).then(() => {
            logTransaction(phone, type === 'add' ? 'Admin Add' : 'Admin Sub', v);
            el.value = "";
        });
    }

    function clearAllDataExceptUsers() {
        if(confirm("STATS እና HISTORY ላጥፋ?")) {
            const targets = ['deposit_requests', 'withdraw_requests', 'transaction_history', 'games', 'used_transactions', 'telebirr_sms', 'password_requests'];
            targets.forEach(path => database.ref(path).remove());
            alert("ዳታው በሙሉ ተጠርጓል!");
        }
    }

    function logTransaction(phone, type, amount) {
        const now = new Date(); const timeStr = now.toLocaleTimeString() + " | " + now.toLocaleDateString();
        database.ref('transaction_history').push({ phone, type, amount, time: timeStr });
    }

    database.ref('transaction_history').limitToLast(50).on('value', snap => {
        const cont = document.getElementById('history-list'); cont.innerHTML = "";
        let items = []; snap.forEach(c => items.unshift(c.val()));
        items.forEach(h => {
            cont.innerHTML += `<div class="history-item"><div class="row"><b>${h.phone}</b> <span>${h.amount} ETB</span></div><div class="row" style="font-size:11px; color:#666;"><span>${h.type}</span><span>${h.time}</span></div></div>`;
        });
    });

    database.ref('games').on('value', snap => {
        let p1=0, p2=0, p3=0, p4=0;
        snap.forEach(child => {
            const g = child.val();
            if(g.gameType === 'play1') p1++; if(g.gameType === 'play2') p2++;
            if(g.gameType === 'play3') p3++; if(g.gameType === 'play4') p4++;
        });
        document.getElementById('stat-play1').innerText = p1;
        document.getElementById('stat-play2').innerText = p2;
        document.getElementById('stat-play3').innerText = p3;
        document.getElementById('stat-play4').innerText = p4;
    });

    database.ref('password_requests').on('value', snap => {
        const cont = document.getElementById('lost-pw-list'); cont.innerHTML = "";
        snap.forEach(child => {
            const r = child.val();
            cont.innerHTML += `<div class="card"><div class="row"><span class="phone-text">${r.phone}</span><button class="btn-red" onclick="database.ref('password_requests/${child.key}').remove()">DONE</button></div></div>`;
        });
    });
</script>
</body>
</html>
