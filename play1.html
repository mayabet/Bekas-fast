<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunamaw - Play 1</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #ffffff; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 400px; height: 100%; border: 3px solid #002d4b; margin: 0 auto; display: flex; flex-direction: column; box-sizing: border-box; }
        .yellow-banner { background: #ffcc00; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #002d4b; flex-shrink: 0; }
        .game-title { font-weight: 900; font-size: 16px; color: #000; }
        .plus18 { color: #ff0000; font-weight: 900; font-size: 24px; }
        .info-section { padding: 6px 12px; color: #002d4b; font-weight: 900; font-size: 14px; flex-shrink: 0; border-bottom: 2px solid #002d4b; }
        .balance-bar { background: #002d4b; color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; font-weight: 900; font-size: 18px; flex-shrink: 0; }
        .instruction { color: #00b050; font-weight: 900; text-align: center; padding: 6px 0; font-size: 16px; text-transform: uppercase; flex-shrink: 0; }
        .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); border: 2px solid #002d4b; margin: 0 5px; flex-shrink: 0; }
        .num-cell { border: 1px solid #002d4b; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #002d4b; cursor: pointer; transition: all 0.1s; position: relative; }
        .user-selected { background: #002d4b !important; color: #fff !important; }
        .taken-cell { background: #ccc !important; color: #666 !important; cursor: not-allowed; }
        .anim-active { background-color: #ff0000 !important; color: white !important; box-shadow: 0 0 15px #ff0000; z-index: 10; border: 2px solid #fff !important; }
        .winner-cell { background-color: #ffcc00 !important; color: black !important; box-shadow: 0 0 25px #ffcc00; transform: scale(1.1); z-index: 15; border: 3px solid #002d4b !important; }
        .winner2-cell { background-color: #00b050 !important; color: white !important; transform: scale(1.05); z-index: 12; border: 2px solid #002d4b !important; }
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 5px; flex-shrink: 0; }
        .stats-table td { border: 2px solid #002d4b; padding: 6px; font-weight: 900; text-align: center; font-size: 14px; }
        .bg-green { background: #00b050; color: white; }
        .list-container { margin: 5px; border: 2px solid #002d4b; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .selected-header { background: #ffcc00; text-align: center; font-weight: 900; padding: 6px; border-bottom: 2px solid #002d4b; font-size: 14px; flex-shrink: 0; }
        .scroll-area { overflow-y: auto; flex-grow: 1; }
        .selected-list { width: 100%; border-collapse: collapse; }
        .selected-list td { border-bottom: 1px solid #002d4b; padding: 8px 10px; font-weight: 900; font-size: 13px; }
        .id-col { width: 85px; border-right: 2px solid #002d4b; text-align: center; background: #eee; }
        .footer-nav { padding: 5px; border-top: 2px solid #002d4b; flex-shrink: 0; }
        .nav-btn { display: block; padding: 12px; text-align: center; color: white; font-weight: bold; text-decoration: none; font-size: 14px; border-radius: 4px; background: #002d4b; }
        .lang-bar { background: #fff; padding: 8px; display: flex; justify-content: space-between; font-weight: 900; border-top: 2px solid #002d4b; font-size: 14px; flex-shrink: 0; }
        .lang-btn { cursor: pointer; color: #002d4b; }
        .lang-btn.active { color: #00b050; text-decoration: underline; }
        .promo-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 10px; }
        .promo-box .brand { color: #8b4513; font-size: 22px; font-weight: 900; }
        .promo-box .text { color: #002d4b; font-size: 16px; margin: 5px 0; font-weight: bold; }
        .promo-box .win { color: #00b050; font-size: 28px; font-weight: 900; }
        .count-span { color: #ff0000; font-weight: 900; font-size: 20px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="yellow-banner"><span class="game-title" id="gt">10 ብር 1ኛ 80 2ኛ 10</span><span class="plus18">18+</span></div>
    <div class="info-section"><div><span id="dt_txt">ቀን</span>: <span id="date-label"></span></div><div><span id="tm_txt">ሰዓት</span>: <span id="time-label"></span></div></div>
    <div class="balance-bar"><span id="bl">ቀሪ ሂሳብ</span><span><span id="cash">0.00</span> <small>ETB</small></span></div>
    <div class="instruction" id="ins">ከ 1 እስከ 10 ያለውን ቁጥር ይምረጡ</div>
    <div class="number-grid" id="grid-container"></div>
    <table class="stats-table">
        <tr><td class="bg-green" id="ms">መልዕክት</td><td colspan="3" id="msg-box" style="font-weight: 900; font-size: 14px; min-height: 25px;">እንኳን ደህና መጡ!</td></tr>
        <tr><td class="bg-green" id="rn">ዙር</td><td id="round-val">1</td><td class="bg-green" id="ls">ያለፈው</td><td id="last-val">0</td></tr>
    </table>
    <div class="list-container">
        <div class="selected-header" id="sh">የተመረጡ ቁጥሮች</div>
        <div class="scroll-area" id="scroll-ui">
            <table class="selected-list" id="sel-table"></table>
        </div>
    </div>
    <div class="footer-nav"><a href="home.html" class="nav-btn" id="bb">ተመለስ</a></div>
    <div class="lang-bar"><span id="ll">ቋንቋ</span><div><span class="lang-btn active" id="l-am" onclick="setLang('am')">አማርኛ</span> | <span class="lang-btn" id="l-en" onclick="setLang('en')">ENGLISH</span></div></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAApcQQ3XySdQ6YG4wnrTUPnm0wZB078QQ",
        authDomain: "bekas-fast-d2a3b.firebaseapp.com",
        databaseURL: "https://bekas-fast-d2a3b-default-rtdb.firebaseio.com",
        projectId: "bekas-fast-d2a3b",
        storageBucket: "bekas-fast-d2a3b.firebasestorage.app",
        messagingSenderId: "130702344830",
        appId: "1:130702344830:web:58577289ec2f3208a64e2f"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const gameRef = database.ref('live_game/play1');
    const resultRef = database.ref('live_game/play1_result');

    const userPhone = localStorage.getItem('loggedUser');
    let userName = "", balance = 0, currentLang = 'am', round = 1, selections = {}, isPlaying = false;

    const trans = {
        'am': {gt:'10 ብር 1ኛ 80 2ኛ 10', bl:'ቀሪ ሂሳብ', ins:'ከ 1 እስከ 10 ያለውን ቁጥር ይምረጡ', ms:'መልዕክት', rn:'ዙር', ls:'ያለፈው', sh:'የተመረጡ ቁጥሮች', bb:'ተመለስ', ll:'ቋንቋ', luck:'እጣዉ እየወጣ ነዉ: ', pick:'ቁጥር {n} ተመርጧል', low:'በቂ ሂሳብ የሎትም', wait: 'እባክዎ ይጠብቁ...', brand: 'ቡናማዉ የቁጥር ጨዋታ ማጫወቻ', promo: '10 ሰዎች ሲሞሉ እጣ ይወጣል', promoWin: '1ኛ 80ብር | 2ኛ 10ብር', dt_txt: 'ቀን', tm_txt: 'ሰዓት', night_p: 'ማታ', day_p: 'ቀን'},
        'en': {gt:'10 BIRR 1st 80 2nd 10', bl:'BALANCE', ins:'SELECT NUMBER 1 UP 10', ms:'MESSAGE', rn:'ROUND', ls:'LAST', sh:'SELECTED NUMBERS', bb:'BACK', ll:'LANGUAGE', luck:'Drawing: ', pick:'NUM {n} SELECTED', low:'LOW BALANCE', wait: 'PLEASE WAIT...', brand: 'BUNAMAW PICKER', promo: 'Game starts at 10 players', promoWin: '1st 80 ETB | 2nd 10 ETB', dt_txt: 'Date', tm_txt: 'Time', night_p: 'Night', day_p: 'Day'}
    };

    if (!userPhone) window.location.replace("index.html");
    database.ref('users/' + userPhone).on('value', (s) => {
        const d = s.val(); if (d) { userName = d.username; balance = parseFloat(d.balance || 0); document.getElementById('cash').innerText = balance.toFixed(2); }
    });

    const grid = document.getElementById('grid-container');
    for(let i=1; i<=10; i++) {
        let cell = document.createElement('div'); cell.className = 'num-cell'; cell.id = `c-${i}`; cell.innerText = i; cell.onclick = () => pick(i); grid.appendChild(cell);
    }

    gameRef.on('value', (s) => { 
        selections = s.val() || {}; 
        if (Object.keys(selections).length === 0 && !isPlaying) resetGridColors();
        updateUI(); 
    });

    async function pick(n) {
        if(isPlaying || selections[n]) return;
        
        // ሲስተሙን በራስ ሰር ማጽዳት (Self-Clean)
        const resSnap = await resultRef.get();
        const resData = resSnap.val();
        if (resData && (Date.now() - resData.startTime > 20000)) {
            await gameRef.remove(); await resultRef.remove();
        }

        if (balance < 10) { document.getElementById('msg-box').innerText = trans[currentLang].low; return; }

        database.ref('users/' + userPhone).update({ balance: balance - 10 });
        gameRef.child(n).set(userName).then(() => {
            gameRef.once('value', (snap) => {
                const current = snap.val() || {};
                if (Object.keys(current).length === 10) {
                    let w1 = Math.floor(Math.random() * 10) + 1;
                    let w2; do { w2 = Math.floor(Math.random() * 10) + 1; } while (w2 === w1);
                    resultRef.set({ winningNum: w1, winningNum2: w2, startTime: firebase.database.ServerValue.TIMESTAMP });
                }
            });
        });
    }

    resultRef.on('value', (snap) => {
        const data = snap.val(); if (!data) return;
        const roundId = data.winningNum + "_" + data.winningNum2 + "_" + data.startTime;
        
        // ላላዩትም ብር እንዲደመር (Background Check)
        if (localStorage.getItem('lastCheck') !== roundId) {
            if (selections[data.winningNum] === userName) database.ref('users/' + userPhone).update({ balance: balance + 80 });
            else if (selections[data.winningNum2] === userName) database.ref('users/' + userPhone).update({ balance: balance + 10 });
            localStorage.setItem('lastCheck', roundId);
        }

        const elapsed = Date.now() - data.startTime;
        const duration = 10000;
        if (elapsed < duration) {
            if (!isPlaying) runAnimation(data.winningNum, data.winningNum2, duration - elapsed);
        } else {
            finishGame(data.winningNum, data.winningNum2);
        }
    });

    function runAnimation(w1, w2, remain) {
        isPlaying = true;
        let timeLeft = Math.floor(remain/1000);
        const msg = document.getElementById('msg-box');
        let cd = setInterval(() => { msg.innerHTML = `${trans[currentLang].luck} <span class="count-span">${timeLeft}</span>`; timeLeft--; if(timeLeft<0) clearInterval(cd); }, 1000);
        
        let anim = setInterval(() => {
            document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('anim-active'));
            document.getElementById(`c-${Math.floor(Math.random()*10)+1}`).classList.add('anim-active');
        }, 100);

        setTimeout(() => { clearInterval(anim); clearInterval(cd); finishGame(w1, w2); }, remain);
    }

    function finishGame(w1, w2) {
        isPlaying = true;
        document.getElementById('last-val').innerText = w1;
        document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('anim-active'));
        document.getElementById(`c-${w1}`).classList.add('winner-cell');
        document.getElementById(`c-${w2}`).classList.add('winner2-cell');
        document.getElementById('msg-box').innerText = `1ኛ: ቁጥር ${w1} | 2ኛ: ቁጥር ${w2}`;

        setTimeout(() => {
            // ዳታውን የሚያጸዳው የመጀመሪያው ተጫዋች ብቻ ነው
            if (Object.values(selections)[0] === userName) {
                gameRef.remove(); resultRef.remove();
            }
            isPlaying = false; resetGridColors();
        }, 5000);
    }

    function updateUI() {
        const scrollArea = document.getElementById('scroll-ui');
        if (Object.keys(selections).length === 0) {
            scrollArea.innerHTML = `<div class="promo-box"><div class="brand">${trans[currentLang].brand}</div><div class="text">${trans[currentLang].promo}</div><div class="win">${trans[currentLang].promoWin}</div></div>`;
            return;
        }
        scrollArea.innerHTML = '<table class="selected-list" id="sel-table"></table>';
        const table = document.getElementById('sel-table');
        for(let i=1; i<=10; i++) {
            const cell = document.getElementById(`c-${i}`);
            let occ = selections[i] || "";
            if (occ === userName) cell.className = "num-cell user-selected";
            else if (occ !== "") cell.className = "num-cell taken-cell";
            if (occ !== "") {
                let row = table.insertRow();
                row.innerHTML = `<td class="id-col">${i}</td><td>${occ}</td>`;
            }
        }
    }

    function resetGridColors() { document.querySelectorAll('.num-cell').forEach(c => { c.className = "num-cell"; }); }
    
    function setLang(l) { 
        currentLang = l; 
        for(let k in trans[l]) { if(document.getElementById(k)) document.getElementById(k).innerText = trans[l][k]; }
        document.getElementById('l-am').classList.toggle('active', l === 'am');
        document.getElementById('l-en').classList.toggle('active', l === 'en');
        updateDateTime(); updateUI();
    }

    function updateDateTime() {
        const now = new Date(); let h = now.getHours(); let ethH = h >= 6 ? h - 6 : h + 6; if (ethH > 12) ethH -= 12; if (ethH === 0) ethH = 12;
        let ampm = h >= 18 || h < 6 ? trans[currentLang].night_p : trans[currentLang].day_p;
        document.getElementById('time-label').innerText = `${ethH}:${now.getMinutes().toString().padStart(2, '0')} ${ampm}`;
        document.getElementById('date-label').innerText = currentLang === 'am' ? "የካቲት 2018" : now.toDateString();
    }

    setInterval(updateDateTime, 1000);
    window.onload = () => setLang('am');
</script>
</body>
</html>
