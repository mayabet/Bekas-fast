<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunamaw - Play 1</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #f4f4f4; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 400px; height: 100%; border: 3px solid #002d4b; margin: 0 auto; display: flex; flex-direction: column; box-sizing: border-box; background: #fff; }
        .yellow-banner { background: #ffcc00; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #002d4b; flex-shrink: 0; }
        .game-title { font-weight: 900; font-size: 16px; color: #000; }
        .info-section { padding: 6px 12px; color: #002d4b; font-weight: 900; font-size: 13px; flex-shrink: 0; border-bottom: 2px solid #002d4b; display: flex; justify-content: space-between; }
        .balance-bar { background: #002d4b; color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; font-weight: 900; font-size: 18px; flex-shrink: 0; }
        .instruction { color: #00b050; font-weight: 900; text-align: center; padding: 5px 0; font-size: 15px; flex-shrink: 0; }
        .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); border: 2px solid #002d4b; margin: 0 5px; flex-shrink: 0; gap: 1px; background: #002d4b; }
        .num-cell { background: #fff; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #002d4b; cursor: pointer; }
        .user-selected { background: #002d4b !important; color: #fff !important; }
        .taken-cell { background: #ccc !important; color: #666 !important; }
        .anim-active { background-color: #ff0000 !important; color: white !important; }
        .winner-cell { background-color: #ffcc00 !important; color: #000 !important; border: 2px solid #002d4b; }
        .winner2-cell { background-color: #00b050 !important; color: #fff !important; }
        
        /* ውጤቶች ዝርዝር */
        .list-container { margin: 5px; border: 2px solid #002d4b; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
        .selected-header { background: #002d4b; color: #ffcc00; text-align: center; font-weight: 900; padding: 6px; font-size: 14px; }
        .scroll-area { overflow-y: auto; flex-grow: 1; }
        .history-table { width: 100%; border-collapse: collapse; }
        .history-table td { border-bottom: 1px solid #ddd; padding: 6px 10px; font-weight: 900; font-size: 12px; }
        .round-head { background: #eee; color: #002d4b; font-size: 11px; padding: 3px 10px !important; border-bottom: 2px solid #002d4b !important; }
        .win1-tag { color: #d4a017; } /* 1st Gold */
        .win2-tag { color: #00b050; } /* 2nd Green */
        
        .footer-nav { padding: 5px; border-top: 2px solid #002d4b; flex-shrink: 0; }
        .nav-btn { display: block; padding: 10px; text-align: center; color: white; font-weight: bold; text-decoration: none; background: #002d4b; border-radius: 4px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="yellow-banner"><span class="game-title">10 ብር 1ኛ 80 2ኛ 10</span><span style="color:red; font-weight:900;">18+</span></div>
    <div class="info-section">
        <span>ቀን: <span id="date-label"></span></span>
        <span>ሰዓት: <span id="time-label"></span></span>
    </div>
    <div class="balance-bar"><span>ቀሪ ሂሳብ</span><span><span id="cash">0.00</span> ETB</span></div>
    <div class="instruction" id="msg-box">ቁጥር ይምረጡ</div>
    
    <div class="number-grid" id="grid-container"></div>
    
    <div style="display:flex; background:#002d4b; color:#fff; font-weight:900; padding:5px; font-size:12px; justify-content: space-around;">
        <span>ዙር: <span id="round-val">1</span></span>
        <span>ያለፈው: <span id="last-val">0</span></span>
    </div>

    <div class="list-container">
        <div class="selected-header" id="list-title">የተመረጡ ቁጥሮች</div>
        <div class="scroll-area" id="scroll-ui">
            <table class="history-table" id="main-table"></table>
        </div>
    </div>

    <div class="footer-nav"><a href="home.html" class="nav-btn">ተመለስ</a></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAApcQQ3XySdQ6YG4wnrTUPnm0wZB078QQ",
        authDomain: "bekas-fast-d2a3b.firebaseapp.com",
        databaseURL: "https://bekas-fast-d2a3b-default-rtdb.firebaseio.com",
        projectId: "bekas-fast-d2a3b",
        storageBucket: "bekas-fast-d2a3b.firebasestorage.app",
        messagingSenderId: "130702344830",
        appId: "1:130702344830:web:58577289ec2f3208a64e2f"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const gameRef = database.ref('live_game/play1');
    const resultRef = database.ref('live_game/play1_result');

    const userPhone = localStorage.getItem('loggedUser');
    let userName = "", balance = 0, round = 1, selections = {}, isPlaying = false;
    let history = JSON.parse(localStorage.getItem('play1_history')) || [];

    database.ref('users/' + userPhone).on('value', snap => {
        if(snap.val()){ userName = snap.val().username; balance = snap.val().balance; document.getElementById('cash').innerText = balance.toFixed(2); }
    });

    // Grid መፍጠሪያ
    const grid = document.getElementById('grid-container');
    for(let i=1; i<=10; i++) {
        let cell = document.createElement('div'); cell.className = 'num-cell'; cell.id = `c-${i}`; cell.innerText = i;
        cell.onclick = () => pick(i); grid.appendChild(cell);
    }

    gameRef.on('value', snap => {
        selections = snap.val() || {};
        updateUI();
    });

    function pick(n) {
        if(isPlaying || (selections[n] && selections[n] !== userName)) return;
        if(selections[n] === userName) {
            database.ref('users/' + userPhone).update({ balance: balance + 10 });
            gameRef.child(n).remove();
        } else {
            if(balance < 10) return alert("በቂ ሂሳብ የሎትም!");
            database.ref('users/' + userPhone).update({ balance: balance - 10 });
            gameRef.child(n).set(userName);
        }
    }

    // ዋናው የUI ማደሻ ፈንክሽን
    function updateUI() {
        const table = document.getElementById('main-table');
        const title = document.getElementById('list-title');
        const count = Object.keys(selections).length;

        // 1. ጨዋታው ገና ከሆነ እና ሰዎች እየመረጡ ከሆነ
        if (count > 0 || isPlaying) {
            title.innerText = "የተመረጡ ቁጥሮች (" + count + ")";
            let html = "";
            for(let i=1; i<=10; i++) {
                const cell = document.getElementById(`c-${i}`);
                cell.className = "num-cell";
                if(selections[i]) {
                    cell.classList.add(selections[i] === userName ? "user-selected" : "taken-cell");
                    html += `<tr><td style="width:30px; text-align:center; background:#eee;">${i}</td><td>${selections[i]}</td></tr>`;
                }
            }
            table.innerHTML = html;
        } 
        // 2. ጨዋታው ካልተጀመረ ያለፉትን 5 ዙር አሳይ
        else {
            title.innerText = "ያለፉት 5 ዙር ውጤቶች";
            resetGrid();
            let html = "";
            history.forEach(res => {
                html += `<tr><td colspan="2" class="round-head">ዙር ${res.r}</td></tr>`;
                html += `<tr><td style="color:#d4a017; font-weight:bold;">${res.n1}</td><td>${res.u1} (1ኛ እጣ 80 ብር)</td></tr>`;
                html += `<tr><td style="color:#00b050; font-weight:bold;">${res.n2}</td><td>${res.u2} (2ኛ እጣ እራሱን ችሏል)</td></tr>`;
            });
            table.innerHTML = html || "<tr><td style='text-align:center; padding:20px;'>ምንም የተመዘገበ ውጤት የለም</td></tr>";
        }
    }

    resultRef.on('value', snap => {
        const data = snap.val();
        if(data && data.status === "START_ANIMATION" && !isPlaying) startAnimation(data.winningNum, data.winningNum2);
    });

    function startAnimation(w1, w2) {
        isPlaying = true;
        let time = 10;
        let timer = setInterval(() => {
            document.getElementById('msg-box').innerHTML = `እጣው እየወጣ ነው... <span style="color:red;">${time--}</span>`;
            if(time < 0) clearInterval(timer);
        }, 1000);

        let anim = setInterval(() => {
            document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('anim-active'));
            document.getElementById(`c-${Math.floor(Math.random()*10)+1}`).classList.add('anim-active');
        }, 100);

        setTimeout(() => {
            clearInterval(anim);
            showWinner(w1, w2);
        }, 11000);
    }

    function showWinner(w1, w2) {
        document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('anim-active'));
        document.getElementById(`c-${w1}`).classList.add('winner-cell');
        document.getElementById(`c-${w2}`).classList.add('winner2-cell');
        document.getElementById('last-val').innerText = w1;

        // ውጤቱን መዝግብ
        const res = { r: round, n1: w1, u1: selections[w1] || "---", n2: w2, u2: selections[w2] || "---" };
        history.unshift(res);
        if(history.length > 5) history.pop();
        localStorage.setItem('play1_history', JSON.stringify(history));

        if(selections[w1] === userName) database.ref('users/' + userPhone).update({ balance: balance + 80 });
        if(selections[w2] === userName) database.ref('users/' + userPhone).update({ balance: balance + 10 });

        setTimeout(() => {
            if(Object.keys(selections)[0] === userName || selections[w1] === userName) {
                database.ref().update({ 'live_game/play1': null, 'live_game/play1_result': null });
            }
            round++;
            document.getElementById('round-val').innerText = round;
            isPlaying = false;
            updateUI();
        }, 5000);
    }

    function resetGrid() {
        document.querySelectorAll('.num-cell').forEach(c => c.className = "num-cell");
    }

    function updateTime() {
        const d = new Date();
        document.getElementById('date-label').innerText = "የካቲት 2018";
        document.getElementById('time-label').innerText = d.getHours() + ":" + d.getMinutes().toString().padStart(2,'0');
    }
    setInterval(updateTime, 1000);
    updateTime();
</script>
</body>
</html>
