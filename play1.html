<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunamaw - Play 1</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #ffffff; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 400px; height: 100%; border: 3px solid #002d4b; margin: 0 auto; display: flex; flex-direction: column; box-sizing: border-box; }
        .yellow-banner { background: #ffcc00; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #002d4b; flex-shrink: 0; }
        .game-title { font-weight: 900; font-size: 16px; color: #000; }
        .plus18 { color: #ff0000; font-weight: 900; font-size: 24px; }
        .info-section { padding: 6px 12px; color: #002d4b; font-weight: 900; font-size: 14px; flex-shrink: 0; border-bottom: 2px solid #002d4b; }
        .balance-bar { background: #002d4b; color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; font-weight: 900; font-size: 18px; flex-shrink: 0; }
        .instruction { color: #00b050; font-weight: 900; text-align: center; padding: 6px 0; font-size: 16px; text-transform: uppercase; flex-shrink: 0; }
        .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); border: 2px solid #002d4b; margin: 0 5px; flex-shrink: 0; }
        .num-cell { border: 1px solid #002d4b; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #002d4b; cursor: pointer; transition: all 0.1s; position: relative; }
        .user-selected { background: #002d4b !important; color: #fff !important; }
        .taken-cell { background: #ccc !important; color: #666 !important; cursor: not-allowed; }
        .anim-active { background-color: #ff0000 !important; color: white !important; box-shadow: 0 0 15px #ff0000; z-index: 10; border: 2px solid #fff !important; }
        .winner-cell { background-color: #ffcc00 !important; color: black !important; box-shadow: 0 0 25px #ffcc00; transform: scale(1.1); z-index: 15; border: 3px solid #002d4b !important; }
        .winner2-cell { background-color: #00b050 !important; color: white !important; transform: scale(1.05); z-index: 12; border: 2px solid #002d4b !important; }
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 5px; flex-shrink: 0; }
        .stats-table td { border: 2px solid #002d4b; padding: 6px; font-weight: 900; text-align: center; font-size: 14px; }
        .bg-green { background: #00b050; color: white; }
        .list-container { margin: 5px; border: 2px solid #002d4b; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .selected-header { background: #ffcc00; text-align: center; font-weight: 900; padding: 6px; border-bottom: 2px solid #002d4b; font-size: 14px; flex-shrink: 0; }
        .scroll-area { overflow-y: auto; flex-grow: 1; }
        .selected-list { width: 100%; border-collapse: collapse; }
        .selected-list td { border-bottom: 1px solid #002d4b; height: 32px; padding: 0 10px; font-weight: 900; font-size: 12px; }
        .id-col { width: 40px; border-right: 2px solid #002d4b; text-align: center; background: #eee; }
        .time-col { width: 75px; font-size: 9px; color: #555; text-align: center; border-right: 1px solid #ddd; }
        .footer-nav { padding: 5px; border-top: 2px solid #002d4b; flex-shrink: 0; }
        .nav-btn { display: block; padding: 12px; text-align: center; color: white; font-weight: bold; text-decoration: none; font-size: 14px; border-radius: 4px; background: #002d4b; }
        .lang-bar { background: #fff; padding: 8px; display: flex; justify-content: space-between; font-weight: 900; border-top: 2px solid #002d4b; font-size: 14px; flex-shrink: 0; }
        .lang-btn { cursor: pointer; color: #002d4b; }
        .lang-btn.active { color: #00b050; text-decoration: underline; }
        .promo-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 15px; }
        .promo-box .brand { color: #8b4513; font-size: 20px; font-weight: 900; margin-bottom: 8px; }
        .promo-box .text { color: #002d4b; font-size: 14px; margin-bottom: 8px; font-weight: bold; }
        .promo-box .win { color: #00b050; font-size: 24px; font-weight: 900; border: 2px dashed #00b050; padding: 5px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="yellow-banner"><span class="game-title" id="gt">10 ብር 1ኛ 80 2ኛ 10</span><span class="plus18">18+</span></div>
    <div class="info-section"><div><span id="dt_txt">ቀን</span>: <span id="date-label"></span></div><div><span id="tm_txt">ሰዓት</span>: <span id="time-label"></span></div></div>
    <div class="balance-bar"><span id="bl">ቀሪ ሂሳብ</span><span><span id="cash">0.00</span> <small>ETB</small></span></div>
    <div class="instruction" id="ins">ከ 1 እስከ 10 ያለውን ቁጥር ይምረጡ</div>
    <div class="number-grid" id="grid-container"></div>
    <table class="stats-table">
        <tr><td class="bg-green" id="ms">መልዕክት</td><td colspan="3" id="msg-box" style="font-weight: 900; font-size: 14px; min-height: 25px;">እንኳን ደህና መጡ!</td></tr>
        <tr><td class="bg-green" id="rn">ዙር</td><td id="round-val">1</td><td class="bg-green" id="ls">ያለፈው</td><td id="last-val">0</td></tr>
    </table>
    <div class="list-container">
        <div class="selected-header" id="sh">የተመረጡ ቁጥሮች</div>
        <div class="scroll-area" id="scroll-ui">
            <table class="selected-list" id="sel-table"></table>
        </div>
    </div>
    <div class="footer-nav"><a href="home.html" class="nav-btn" id="bb">ተመለስ</a></div>
    <div class="lang-bar"><span id="ll">ቋንቋ</span><div><span class="lang-btn active" id="l-am" onclick="setLang('am')">አማርኛ</span> | <span class="lang-btn" id="l-en" onclick="setLang('en')">ENGLISH</span></div></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAApcQQ3XySdQ6YG4wnrTUPnm0wZB078QQ",
        authDomain: "bekas-fast-d2a3b.firebaseapp.com",
        databaseURL: "https://bekas-fast-d2a3b-default-rtdb.firebaseio.com",
        projectId: "bekas-fast-d2a3b",
        storageBucket: "bekas-fast-d2a3b.firebasestorage.app",
        messagingSenderId: "130702344830",
        appId: "1:130702344830:web:58577289ec2f3208a64e2f"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const gameRef = database.ref('live_game/play1');
    const resultRef = database.ref('live_game/play1_result');
    const historyRef = database.ref('live_game/play1_history');

    const userPhone = localStorage.getItem('loggedUser');
    let userName = "", balance = 0, currentLang = 'am', round = 1, selections = {}, isPlaying = false, isResetting = false;
    let historyList = [];

    const trans = {
        'am': {gt:'10 ብር 1ኛ 80 2ኛ 10', bl:'ቀሪ ሂሳብ', ins:'ከ 1 እስከ 10 ያለውን ቁጥር ይምረጡ', ms:'መልዕክት', rn:'ዙር', ls:'ያለፈው', sh:'የተመረጡ ቁጥሮች', bb:'ተመለስ', ll:'ቋንቋ', luck:'እጣዉ እየወጣ ነዉ: ', pick:'ቁጥር {n} ተመርጧል', low:'በቂ ሂሳብ የሎትም', removed: 'ቁጥር {n} ተሰርዟል', wait: 'እባክዎ ይጠብቁ...', brand: 'ቡናማዉ የቁጥር ጨዋታ ማጫወቻ', promo: 'ጨዋታዉ ከ 10 ሰዎች ጋር ሲሆን 1ኛ እና 2ኛ እጣ ይወጣል', promoWin: '1ኛ 80ብር | 2ኛ 10ብር', dt_txt: 'ቀን', tm_txt: 'ሰዓት', win_list: 'የባለፈው 5 ዙር አሸናፊዎች (ታማኝነት)'},
        'en': {gt:'10 BIRR 1st 80 2nd 10', bl:'BALANCE', ins:'SELECT NUMBER 1 UP 10', ms:'MESSAGE', rn:'ROUND', ls:'LAST', sh:'SELECTED NUMBERS', bb:'BACK', ll:'LANGUAGE', luck:'Drawing now: ', pick:'NUM {n} SELECTED', low:'LOW BALANCE', removed: 'NUM {n} REMOVED', wait: 'PLEASE WAIT...', brand: 'BUNAMAW NUMBER PICKER', promo: 'Game with 10 people. 1st & 2nd winners', promoWin: '1st 80 ETB | 2nd 10 ETB', dt_txt: 'Date', tm_txt: 'Time', win_list: 'LAST 5 ROUND WINNERS'}
    };

    if (!userPhone) {
        window.location.replace("index.html");
    } else {
        database.ref('users/' + userPhone).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) { userName = data.username; balance = parseFloat(data.balance || 0); document.getElementById('cash').innerText = balance.toFixed(2); }
        });
    }

    const grid = document.getElementById('grid-container');
    for(let i=1; i<=10; i++) {
        let cell = document.createElement('div'); cell.className = 'num-cell'; cell.id = `c-${i}`; cell.innerText = i; cell.onclick = () => pick(i); grid.appendChild(cell);
    }

    historyRef.limitToLast(5).on('value', (snap) => {
        historyList = [];
        snap.forEach(child => { historyList.unshift(child.val()); });
        updateUI();
    });

    gameRef.on('value', (snapshot) => {
        selections = snapshot.val() || {};
        if (Object.keys(selections).length === 0 && !isPlaying) { isResetting = false; resetGridColors(); }
        updateUI();
    });

    function pick(n) {
        const msg = document.getElementById('msg-box');
        if(isPlaying || isResetting) return;
        if (selections[n] && selections[n] !== userName) return;

        if (selections[n] === userName) {
            database.ref('users/' + userPhone).update({ balance: balance + 10 });
            gameRef.child(n).remove();
            return;
        }

        if (balance < 10) { msg.innerText = trans[currentLang].low; return; }

        database.ref('users/' + userPhone).update({ balance: balance - 10 });
        gameRef.child(n).set(userName).then(() => {
            gameRef.once('value', (snap) => {
                const currentSelections = snap.val() || {};
                if (Object.keys(currentSelections).length === 10 && !isPlaying) {
                    let win1 = Math.floor(Math.random() * 10) + 1;
                    let win2; do { win2 = Math.floor(Math.random() * 10) + 1; } while (win2 === win1);
                    resultRef.set({ winningNum: win1, winningNum2: win2, status: "START_ANIMATION", timestamp: Date.now() });
                }
            });
        });
    }

    function updateUI() {
        const scrollArea = document.getElementById('scroll-ui');
        const header = document.getElementById('sh');
        const count = Object.keys(selections).length;

        // 1. ማንም ሳይመርጥ Promo ይታያል
        if (count === 0 && !isPlaying) {
            header.innerText = trans[currentLang].sh;
            scrollArea.innerHTML = `
                <div class="promo-box">
                    <div class="brand">${trans[currentLang].brand}</div>
                    <div class="text">${trans[currentLang].promo}</div>
                    <div class="win">${trans[currentLang].promoWin}</div>
                </div>`;
            return;
        }

        // 2. መመረጥ ሲጀምር ታሪክ እና ዝርዝር አብረው ይታያሉ
        header.innerText = trans[currentLang].sh;
        let html = '<table class="selected-list">';
        
        // ታሪክ ከላይ
        if (historyList.length > 0) {
            html += `<tr><td colspan="3" style="background:#eee; text-align:center; font-size:10px; color:#002d4b; font-weight:900; padding:4px;">${trans[currentLang].win_list}</td></tr>`;
            historyList.forEach(h => {
                html += `<tr style="background:#fff9c4;"><td class="time-col">${h.time}</td><td class="id-col" style="background:#ffcc00">${h.n}</td><td>${h.u}</td></tr>`;
            });
            html += `<tr><td colspan="3" style="background:#00b050; height:2px;"></td></tr>`;
        }

        // የተመረጡ ቁጥሮች
        for(let i=1; i<=10; i++) {
            const cell = document.getElementById(`c-${i}`);
            let occupant = selections[i] || "";
            if (occupant === userName) cell.className = "num-cell user-selected";
            else if (occupant !== "") cell.className = "num-cell taken-cell";
            else if (!isPlaying) cell.className = "num-cell";
            
            if (occupant !== "") {
                html += `<tr><td class="id-col">${i}</td><td colspan="2" style="font-weight:900;">${occupant}</td></tr>`;
            }
        }
        scrollArea.innerHTML = html + '</table>';
    }

    resultRef.on('value', (snap) => {
        const data = snap.val();
        if (!data || isPlaying) return;
        if (data.status === "START_ANIMATION") {
            isPlaying = true;
            runAnimation(data.winningNum, data.winningNum2);
        }
    });

    function runAnimation(win1, win2) {
        let timeLeft = 10;
        const msg = document.getElementById('msg-box');
        let countdown = setInterval(() => {
            msg.innerHTML = `${trans[currentLang].luck} <span style="color:red; font-size:20px;">${timeLeft}</span>`;
            if (--timeLeft < 0) clearInterval(countdown);
        }, 1000);

        let animation = setInterval(() => {
            document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('anim-active'));
            document.getElementById(`c-${Math.floor(Math.random() * 10) + 1}`).classList.add('anim-active');
        }, 100);

        setTimeout(() => {
            clearInterval(animation);
            clearInterval(countdown);
            finishGame(win1, win2);
        }, 10000);
    }

    function finishGame(win1, win2) {
        const msg = document.getElementById('msg-box');
        document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('anim-active'));
        document.getElementById(`c-${win1}`).classList.add('winner-cell');
        document.getElementById(`c-${win2}`).classList.add('winner2-cell');
        document.getElementById('last-val').innerText = win1;

        const timeNow = document.getElementById('time-label').innerText.split(' ')[0];
        const record = { n: win1, u: selections[win1] || "---", time: timeNow };

        if(selections[win1] === userName) {
            database.ref('users/' + userPhone).update({ balance: balance + 80 });
            msg.innerText = "80 ብር አሸንፈዋል!";
        }

        setTimeout(() => {
            if (Object.keys(selections)[0] === userName || selections[win1] === userName) {
                historyRef.push(record);
                database.ref('live_game/play1').remove();
                database.ref('live_game/play1_result').remove();
            }
            isPlaying = false;
            document.getElementById('round-val').innerText = ++round;
            resetGridColors();
            updateUI();
        }, 5000);
    }

    function resetGridColors() {
        document.querySelectorAll('.num-cell').forEach(c => c.className = "num-cell");
    }

    function setLang(l) { 
        currentLang = l; 
        for(let k in trans[l]) { let el = document.getElementById(k); if(el) el.innerText = trans[l][k]; }
        document.getElementById('l-am').classList.toggle('active', l === 'am');
        document.getElementById('l-en').classList.toggle('active', l === 'en');
        updateUI();
    }

    function updateDateTime() {
        const now = new Date();
        let h = now.getHours();
        let ethH = h >= 6 ? h - 6 : h + 6; if (ethH > 12) ethH -= 12; if (ethH === 0) ethH = 12;
        let ampm = h >= 18 || h < 6 ? (currentLang === 'am' ? 'ማታ' : 'Night') : (currentLang === 'am' ? 'ቀን' : 'Day');
        document.getElementById('time-label').innerText = `${ethH}:${now.getMinutes().toString().padStart(2, '0')} ${ampm}`;
        document.getElementById('date-label').innerText = currentLang === 'am' ? "የካቲት 2018" : now.toDateString();
    }

    setInterval(updateDateTime, 1000);
    window.onload = () => { setLang('am'); updateDateTime(); };
</script>
</body>
</html>
